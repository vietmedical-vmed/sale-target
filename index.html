const titleWord = w => w ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase() : w;

  if (name == null) return name;

    prefix = 'BV ';
    words = words.slice(2);
  }
  return prefix + words.map(titleWord).join(' ');

const SUPABASE_URL = "https://nrfxymnfmjhbsgpipvkb.supabase.co";

const FN_LOGIN = SUPABASE_URL + "/functions/v1/sale_target-login";
const FN_API = SUPABASE_URL + "/functions/v1/sale_target-api";

async function api(action, payload = {}) {
  const token = sessionStorage.getItem(TOK_KEY) || '';
  const isLogin = action === 'login';
  const url = isLogin ? FN_LOGIN : FN_API;
  const bodyObj = isLogin ? payload : { action, token, payload };
  let res;
  try {
    res = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      },
      body: JSON.stringify(bodyObj)
    });
  } catch (e) {
    throw new Error('Không kết nối được máy chủ: ' + (e && e.message || e));
  }
  let data = null;
  try { data = await res.json(); } catch { /* body rỗng / không phải JSON */ }
  // Chỉ coi là lỗi khi HTTP không 2xx, HOẶC server báo ok:false rõ ràng.
  // (Response login hiện tại KHÔNG có field `ok` → không được ném lỗi ở đây,
  //  nếu không sẽ hiện "unknown" dù đăng nhập đã thành công.)
  if (!res.ok || (data && data.ok === false)) {
    const err = (data && data.error) || ('HTTP ' + res.status);
    if (err === 'unauthorized') sessionStorage.removeItem(TOK_KEY);
    throw new Error(err);
  }
  if (!data) throw new Error('Máy chủ trả về dữ liệu rỗng');
  return data;
}

// ============ ERROR BOUNDARY ============
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = {
      error: null

  }
  static getDerivedStateFromError(error) {
    return {
      error
    };
  }
  componentDidCatch(error, info) {
    console.error('[react error]', error, info);
  }
  render() {
    if (this.state.error) {
      return React.createElement('div', {
        style: {
          padding: 24,
          fontFamily: 'monospace',
          background: '#fef2f2',
          minHeight: '100vh'
        }

// Khung bảng cao gần trọn màn hình → chỉ có bảng cuộn dọc, nhờ đó header dính
// (.sticky-head) luôn nằm trong tầm nhìn.
// Chiều cao KHÔNG trừ phần thẻ số + bộ lọc phía trên (thanh tiêu đề mới là thứ dính
// lại), nếu trừ thì khung chỉ còn ~340px — lùn. Đổi lại, khi bảng dài hơn khung thì
// kéo trang xuống 1 lần cho khung nằm ngay dưới thanh tiêu đề, chiếm trọn màn hình.
// Là max-height nên bảng ngắn (layer mặc định) vẫn hiện đủ, không sinh thanh cuộn.
function useFitHeight() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let firstFit = true;
    const fit = () => {
      const vh = window.innerHeight || document.documentElement.clientHeight || 0;
      const bar = document.querySelector('header.sticky')?.offsetHeight || 0;
      const h = vh - bar - 32; // chừa lề dưới
      // Không đo được chiều cao (nhúng/snapshot) hoặc màn quá thấp → để bảng cao tự
      // nhiên như cũ, thà mất header dính còn hơn ép bảng lùn tịt.
      if (vh < 400 || h < 320) { el.style.maxHeight = ''; return; }
      el.style.maxHeight = h + 'px';
      if (firstFit && el.scrollHeight > el.clientHeight + 4) {
        const docTop = el.getBoundingClientRect().top + window.scrollY;
        // chỉ kéo xuống, không bao giờ giật ngược lên chỗ người dùng đang xem
        if (window.scrollY < docTop - bar) window.scrollTo(0, docTop - bar);
      }
      firstFit = false;
    };
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);
  return ref;
}

// Đo chiều cao thanh tiêu đề + thanh bộ lọc rồi ghi vào CSS var, để .sticky-filter
// và .sticky-cust canh đúng chỗ. Phải đo động vì cả 2 thanh đều flex-wrap: màn hình
// hẹp là chúng cao thêm một dòng, hardcode px sẽ lệch.
// Làm tròn lên để không hở 1 vệt nội dung phía trên thanh dính do lẻ subpixel.
function useStickyBars(active, hasCards) {
  useEffect(() => {
    const root = document.documentElement;
    const measure = () => {
      const head = document.querySelector('header.sticky');
      const filt = document.querySelector('.sticky-filter');
      // Mọi thẻ KH cao như nhau -> đo thẻ đầu tiên là đủ cho thanh nhóm SP.
      const cust = document.querySelector('.sticky-cust');
      root.style.setProperty('--app-header-h', Math.ceil(head ? head.getBoundingClientRect().height : 0) + 'px');
      root.style.setProperty('--app-filter-h', Math.ceil(filt ? filt.getBoundingClientRect().height : 0) + 'px');
      root.style.setProperty('--app-cust-h', Math.ceil(cust ? cust.getBoundingClientRect().height : 0) + 'px');
    };

// Bảng phân cấp (2 màn tổng hợp): ghim hàng nhóm lại theo cấp khi cuộn trong

//
// KHÔNG làm được bằng CSS thuần như các thẻ ở màn chi tiết: đã đo thực tế,
// <tbody> không chặn được position:sticky của <tr>, nên mọi hàng cùng cấp cùng
// dính vào một chỗ, chồng lên nhau và hàng của nhóm cũ treo lại vĩnh viễn.
// Vì vậy tự chọn: mỗi cấp chỉ ĐÚNG MỘT hàng được sticky — chuỗi tổ tiên của
// vùng đang xem. Hàng cần ghim đánh dấu bằng data-lv="0|1|2…".
function useStickyRows(boxRef) {
  useEffect(() => {
    const box = boxRef.current;
    if (!box) return;
    let rows = [];       // { el, lv, top (vị trí tự nhiên), h }
    let base = 0;        // chiều cao thead — vạch ghim của cấp 0
    let pinned = [];
    let raf = 0;
    const clear = el => { el.style.position = ''; el.style.top = ''; el.style.zIndex = ''; };

    // Đo lại vị trí TỰ NHIÊN của các hàng. Phải gỡ sticky trước khi đo: hàng
    // đang ghim trả về vị trí đã dịch, lấy số đó tính tiếp là sai chồng sai.
    const remeasure = () => {
      pinned.forEach(clear);
      pinned = [];
      const els = Array.from(box.querySelectorAll('tr[data-lv]'));
      els.forEach(clear);
      const head = box.querySelector('thead');
      base = head ? head.offsetHeight : 0;
      const origin = box.getBoundingClientRect().top - box.scrollTop;
      rows = els.map(el => ({
        el,
        lv: Number(el.dataset.lv) || 0,
        top: el.getBoundingClientRect().top - origin,
        h: el.offsetHeight
      }));
      // end[i] = vị trí hàng nhóm kế tiếp có cấp NGANG HOẶC NÔNG HƠN — tức là
      // chỗ nhóm i kết thúc. Hàng ghim của nhóm i không được vượt quá mốc này,
      // nhờ vậy nhóm sau đẩy nhóm trước ra thay vì che khuất nó.
      const st = [];
      for (let i = rows.length - 1; i >= 0; i--) {
        while (st.length && rows[st[st.length - 1]].lv > rows[i].lv) st.pop();
        rows[i].end = st.length ? rows[st[st.length - 1]].top : box.scrollHeight;
        st.push(i);
      }
    };

    const apply = () => {
      const s = box.scrollTop;
      // Chuỗi tổ tiên của vùng đang xem: hàng nào đã cuộn qua vạch ghim của cấp
      // nó thì thay chỗ hàng cùng cấp trước đó và xoá các cấp sâu hơn. Quét hết
      // mảng: hàng nằm dưới vị trí đang xem không bao giờ thoả điều kiện nên
      // chuỗi tự dừng cập nhật (mảng chỉ gồm hàng nhóm nên rất ngắn).
      const chain = [];
      for (const r of rows) {
        let pin = base;
        for (let i = 0; i < r.lv; i++) if (chain[i]) pin += chain[i].h;
        if (r.top - s > pin) continue;
        chain.length = r.lv;
        chain[r.lv] = r;
      }
      const keep = chain.filter(Boolean);
      const want = new Set(keep.map(r => r.el));
      pinned.forEach(el => { if (!want.has(el)) clear(el); });
      let top = base;
      keep.forEach(r => {
        // Kẹp theo mốc kết thúc nhóm -> nhóm sắp tới đẩy hàng ghim này lên và ra.
        const t = Math.min(top, r.end - s - r.h);
        r.el.style.position = 'sticky';
        r.el.style.top = t + 'px';
        r.el.style.zIndex = String(15 - r.lv); // vẫn dưới thead (z-20)
        top = t + r.h;
      });
      pinned = keep.map(r => r.el);
    };

    // Một khe rAF dùng chung: cuộn thì chỉ cần tính lại vị trí ghim, còn
    // gập/mở hay đổi kích thước thì phải đo lại trước khi tính.
    let needRe = false;
    const tick = () => {
      raf = 0;
      if (needRe) { needRe = false; remeasure(); }
      apply();
    };
    const schedule = re => {
      if (re) needRe = true;
      if (!raf) raf = requestAnimationFrame(tick);
    };

    remeasure();
    apply();
    const onScroll = () => schedule(false);
    const onResize = () => schedule(true);
    box.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onResize);
    // Gập/mở nhóm nằm trong state của từng hàng con -> component cha không hay
    // biết. Theo dõi thay đổi DOM để đo lại, thay vì phải nâng state lên.
    // Chỉ nghe childList: apply() ghi style (đổi attribute), nghe cả attribute
    // là tự gọi lại chính mình thành vòng lặp.
    const mo = typeof MutationObserver === 'function'
      ? new MutationObserver(() => schedule(true)) : null;
    if (mo) mo.observe(box, { childList: true, subtree: true });
    return () => {
      if (raf) cancelAnimationFrame(raf);
      if (mo) mo.disconnect();
      box.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onResize);
      pinned.forEach(clear);
    };
  }, [boxRef]);
}

  // KH update cả năm (SL) = tháng đã qua lấy thực hiện, từ tháng hiện tại trở đi lấy SL update
  // → giống định nghĩa cột "KH update" ở màn PS, để % KH YTD nhất quán giữa 2 màn.
  const updAnnual = (node) => node.moKh.reduce((s, v, i) => s + (i < curIdx ? node.moAct[i] : v), 0);
  // Luỹ kế YTD (đến hết tháng hiện tại): KH · TH · % TH YTD · tốc độ TH YTD · tốc độ KH YTD · CL tốc độ
  // % TH YTD = TH YTD / KH YTD ; tốc độ TH YTD = TH YTD / KH update cả năm ;
  // tốc độ KH YTD = KH YTD / KH update cả năm ; CL tốc độ = tốc độ TH YTD − tốc độ KH YTD (điểm %).
  const ytdCells = (node, extra) => {
    const totKh = updAnnual(node);
    const tdTh = totKh > 0 ? node.thYtd / totKh : null;
    const tdKh = totKh > 0 ? node.khYtd / totKh : null;
    const clVal = (tdTh != null && tdKh != null) ? Math.round((tdTh - tdKh) * 100) : null;
    return [
      h('td', { key: 'yk', className: `px-3 py-1.5 text-right text-[12px] tabular-nums bg-amber-50/40 ${extra || ''}` }, fmtInt(node.khYtd)),
      h('td', { key: 'ya', className: `px-3 py-1.5 text-right text-[12px] tabular-nums text-orange-700 bg-amber-50/40 ${extra || ''}` }, fmtInt(node.thYtd)),
      h('td', { key: 'yp', className: `px-3 py-1.5 text-right text-[12px] tabular-nums font-semibold bg-amber-50/40 ${pctCls(node.thYtd, node.khYtd)}` }, pctTxt(node.thYtd, node.khYtd)),
      h('td', { key: 'ytd', className: `px-3 py-1.5 text-right text-[12px] tabular-nums text-slate-500 bg-amber-50/40` }, pctTxt(node.thYtd, totKh)),
      h('td', { key: 'ykp', className: `px-3 py-1.5 text-right text-[12px] tabular-nums text-slate-500 bg-amber-50/40` }, pctTxt(node.khYtd, totKh)),
      h('td', { key: 'ycl', className: `px-3 py-1.5 text-right text-[12px] tabular-nums font-semibold border-r border-slate-200 bg-amber-50/40 ${chCls(clVal || 0)}` }, clVal == null ? '—' : (clVal > 0 ? '+' : '') + clVal + '%')
    ];
  };

  const conLai = (v) => h('td', {
    className: 'px-3 py-1.5 text-right text-[12px] tabular-nums font-medium text-blue-700 border-r border-slate-100'
  }, fmtInt(v));
  const quotaCell = (v, cls) => h('td', {
    className: `px-3 py-1.5 text-right text-[12px] tabular-nums font-medium text-slate-600 border-r border-slate-100 ${cls || ''}`
  }, fmtInt(v));
  // Quota khả dụng còn lại = tổng quota − (thực hiện YTD + KH còn lại YTD) — giống màn chi tiết
  // Dòng "Ngoài kế hoạch" không có quota → hiện "—" thay vì số âm
  const khaDungCell = (node, cls) => h('td', {
    className: `px-3 py-1.5 text-right text-[12px] tabular-nums font-medium ${node.oop ? 'text-slate-300' : 'text-slate-700'} ${cls || ''}`
  }, node.oop ? '—' : fmtInt((node.quota || 0) - (node.thYtd + sumFromNow(node.moKh))));

  // Cột nhãn dính trái khi cuộn ngang — nền phải đục, không dùng màu trong suốt
  const stickyLabel = (bg) => `sticky left-0 z-10 border-r border-slate-200 ${bg}`;

  // Nút xuất Excel nằm trên thanh bộ lọc (do App vẽ) → đăng ký hàm xuất lên đó
  useEffect(() => {
    onExport(() => exportProductSummary(data));
    return () => onExport(null);
  }, [data, onExport]);

  return h('div', { className: 'px-6 pb-8' },
    h('div', { className: 'bg-white rounded-lg border border-slate-200 overflow-hidden' },
      h('div', { className: 'flex items-center justify-end gap-2 px-3 py-2 border-b border-slate-100 bg-slate-50/50' },
        h('button', {
          onClick: () => setShowMonths(s => !s),
          title: showMonths ? 'Thu gọn, chỉ hiện tháng hiện tại + Luỹ kế YTD' : 'Hiện chi tiết theo từng tháng',
          className: 'inline-flex items-center gap-1.5 px-3 py-1.5 text-[12px] font-medium rounded-md border border-slate-200 bg-white text-slate-600 hover:bg-slate-50'
        }, showMonths ? '▾ Thu gọn theo tháng' : '▸ Chi tiết theo tháng')),
      h('div', { ref: boxRef, className: 'overflow-auto scroll-shadow' },
        h('table', { className: 'w-full border-collapse sticky-head' },
          h('thead', null,
            h('tr', { className: 'bg-slate-100' },
              h('th', { rowSpan: 2, className: `px-4 py-2 text-left text-[11px] font-semibold uppercase tracking-wide text-slate-600 border-b align-bottom ${stickyLabel('bg-slate-100')}`, style: { minWidth: 220 } }, 'Sản phẩm / Miền / KH'),
              ...moHead(),
              h('th', { colSpan: 6, className: 'px-3 py-1.5 text-center text-[11px] font-bold uppercase tracking-wide text-amber-800 border-r border-b border-slate-200 bg-amber-50/60' }, 'Luỹ kế YTD'),
              h('th', { rowSpan: 2, className: 'px-3 py-2 text-right text-[11px] font-semibold uppercase tracking-wide text-slate-600 border-r border-b border-slate-200 align-bottom' }, 'Tổng Quota'),
              h('th', { rowSpan: 2, className: 'px-3 py-2 text-right text-[11px] font-semibold uppercase tracking-wide text-slate-600 border-r border-b border-slate-200 align-bottom' }, 'KH còn lại YTD'),
              h('th', { rowSpan: 2, className: 'px-3 py-2 text-right text-[11px] font-semibold uppercase tracking-wide text-slate-600 border-b border-slate-200 align-bottom' }, 'Quota khả dụng còn lại')
            ),
            h('tr', { className: 'bg-slate-100' },
              ...monthIdxs.flatMap(i => hasAct(i) ? subHead('s' + i, MONTHS[i] === CURRENT_MONTH ? 'bg-blue-50/40' : '') : []),
              ...ytdSubHead
            )
          ),
          h('tbody', null,
            data.prods.length === 0
              ? h('tr', null, h('td', { colSpan: N_COLS, className: 'px-4 py-12 text-center text-slate-400 text-sm' }, rows.length === 0 ? 'Sheet trống' : 'Không có sản phẩm nào khớp bộ lọc'))
              : data.prods.map(p => {
                  const isOpen = open.has(p.prod);
                  const out = [
                    h('tr', { key: p.prod, 'data-lv': 0, className: 'bg-slate-50 cursor-pointer border-b border-slate-200', onClick: () => toggle(p.prod) },
                      h('td', { className: `px-4 py-2 text-[12.5px] font-semibold text-slate-800 ${stickyLabel('bg-slate-50')}` },
                        h('span', { className: 'inline-block w-3 text-slate-400' }, isOpen ? '▾' : '▸'), ' ', p.prod
                      ),
                      ...moCells(p, 'font-medium'),
                      ...ytdCells(p, 'font-semibold'),
                      quotaCell(p.quota, 'font-semibold text-slate-700'),
                      conLai(sumFromNow(p.moKh)),
                      khaDungCell(p, 'font-semibold text-slate-800')
                    )
                  ];
                  if (isOpen) {
                    for (const rg of p.regs) {
                      const rKey = p.prod + '||' + rg.region;
                      const rOpen = open.has(rKey);
                      const hasCust = rg.custs && rg.custs.length > 0;
                      out.push(
                        // bg đục (không phải /40) để lúc bị ghim không lộ dữ liệu chạy phía sau
                        h('tr', { key: rKey, 'data-lv': 1, className: 'border-b border-slate-100 bg-slate-50' + (hasCust ? ' cursor-pointer' : ''), onClick: hasCust ? () => toggle(rKey) : undefined },
                          h('td', { className: `pl-10 pr-4 py-1.5 text-[12px] font-medium text-slate-700 ${stickyLabel('bg-slate-50')}` },
                            h('span', { className: 'inline-block w-3 text-slate-400' }, hasCust ? (rOpen ? '▾' : '▸') : ''), ' ', rg.region
                          ),
                          ...moCells(rg),
                          ...ytdCells(rg),
                          quotaCell(rg.quota),
                          conLai(sumFromNow(rg.moKh)),
                          khaDungCell(rg)
                        )
                      );
                      if (rOpen) {
                        // Nhóm "Ngoài kế hoạch" mở ra được để xem từng KH thật bên dưới
                        const custRow = (cu, key, pad, kids) => h('tr', {
                          key, className: 'border-b border-slate-100' + (kids ? ' cursor-pointer bg-amber-50/30' : ''),
                          onClick: kids ? () => toggle(key) : undefined
                        },
                          h('td', { className: `${pad} pr-4 py-1.5 text-[11.5px] text-slate-500 ${stickyLabel('bg-white')}` },
                            h('span', { className: 'inline-block w-3 text-slate-400' }, kids ? (open.has(key) ? '▾' : '▸') : ''),
                            h('span', { className: 'truncate' + (cu.cust === OOP_CUST ? ' text-amber-700 font-medium' : '') }, cu.cust), ' ',
                            cu.cust === OOP_CUST
                              ? h('span', { className: 'text-[9.5px] px-1.5 py-0.5 rounded bg-amber-100 text-amber-700 font-medium whitespace-nowrap' }, 'Ngoài KH')
                              : h('span', { className: 'text-[10px] text-slate-400 font-mono' }, cu.custId)
                          ),
                          ...moCells(cu),
                          ...ytdCells(cu),
                          quotaCell(cu.quota),
                          conLai(sumFromNow(cu.moKh)),
                          khaDungCell(cu)
                        );
                        for (const cu of rg.custs) {
                          const cKeyStr = rKey + '||' + cu.cust;
                          const subs = cu.subs || [];
                          out.push(custRow(cu, cKeyStr, 'pl-16', subs.length > 0));
                          if (subs.length && open.has(cKeyStr)) {
                            for (const s of subs) out.push(custRow(s, cKeyStr + '||' + s.cust, 'pl-24', false));
                          }
                        }
                      }
                    }
                  }
                  return out;
                }),
            h('tr', { className: 'bg-slate-800 text-white font-semibold' },
              h('td', { className: `px-4 py-2.5 text-[12.5px] border-t-2 border-slate-900 sticky left-0 z-10 bg-slate-800` }, 'TỔNG CỘNG'),
              ...monthIdxs.flatMap(i => {
                const kh = data.grand.moKh[i], act = data.grand.moAct[i];
                const cells = [h('td', { key: 'gk' + i, className: 'px-2 py-2.5 text-right text-[12px] tabular-nums' }, fmtInt(kh))];
                if (hasAct(i)) {
                  cells.push(h('td', { key: 'ga' + i, className: 'px-2 py-2.5 text-right text-[12px] tabular-nums text-orange-200' }, fmtInt(act)));
                  cells.push(h('td', { key: 'gp' + i, className: 'px-2 py-2.5 text-right text-[11.5px] tabular-nums text-slate-300' }, pctTxt(act, kh)));
                }
                return cells;
              }),
              h('td', { className: 'px-3 py-2.5 text-right text-[12.5px] tabular-nums' }, fmtInt(data.grand.khYtd)),
              h('td', { className: 'px-3 py-2.5 text-right text-[12.5px] tabular-nums text-orange-200' }, fmtInt(data.grand.thYtd)),
              h('td', { className: 'px-3 py-2.5 text-right text-[12.5px] tabular-nums' }, pctTxt(data.grand.thYtd, data.grand.khYtd)),
              h('td', { className: 'px-3 py-2.5 text-right text-[12.5px] tabular-nums text-slate-300' }, pctTxt(data.grand.thYtd, updAnnual(data.grand))),
              h('td', { className: 'px-3 py-2.5 text-right text-[12.5px] tabular-nums text-slate-300' }, pctTxt(data.grand.khYtd, updAnnual(data.grand))),
              (() => {
                const totKh = updAnnual(data.grand);
                const tdTh = totKh > 0 ? data.grand.thYtd / totKh : null;
                const tdKh = totKh > 0 ? data.grand.khYtd / totKh : null;
                const clVal = (tdTh != null && tdKh != null) ? Math.round((tdTh - tdKh) * 100) : null;
                return h('td', { className: 'px-3 py-2.5 text-right text-[12.5px] tabular-nums' }, clVal == null ? '—' : (clVal > 0 ? '+' : '') + clVal + '%');
              })(),
              h('td', { className: 'px-3 py-2.5 text-right text-[12.5px] tabular-nums' }, fmtInt(data.grand.quota)),
              h('td', { className: 'px-3 py-2.5 text-right text-[12.5px] tabular-nums' }, fmtInt(sumFromNow(data.grand.moKh))),
              h('td', { className: 'px-3 py-2.5 text-right text-[12.5px] tabular-nums' }, fmtInt((data.grand.quota || 0) - (data.grand.thYtd + sumFromNow(data.grand.moKh))))
            )
          )
        )
      )
    )
  );
}

// ============ XUẤT EXCEL — giữ cấu trúc phân cấp (gập/mở) + header gộp ============
const _ec = (r, c) => window.XLSX.utils.encode_cell({ r, c });
const _today = () => new Date().toISOString().slice(0, 10).replace(/-/g, '');
// Áp định dạng số + kiểu cho 1 ô (SheetJS community hỗ trợ number format qua .z)
const _fmt = (ws, r, c, z) => { const cell = ws[_ec(r, c)]; if (cell && cell.v !== '' && cell.v != null) cell.z = z; };

function exportSummaryPS(data) {
  const XLSX = window.XLSX;
  if (!XLSX) { alert('Chưa tải được thư viện Excel, vui lòng tải lại trang rồi thử lại.'); return; }
  const tr = v => (Number(v) || 0) / 1e6; // VND → triệu VND
  const curIdx = Math.max(0, MONTHS.indexOf(CURRENT_MONTH));
  const hasAct = i => i <= curIdx; // tháng đã qua/hiện tại: 3 cột con; tháng sau: 1 cột KH
  // ---- Header 2 tầng: giống bố cục màn hình (giá trị theo tháng & YTD = doanh thu, triệu VND) ----
  const H1 = ['Miền / PS / Khách hàng', 'Số KH'], H2 = ['', ''];
  const merges = [{ s: { r: 0, c: 0 }, e: { r: 1, c: 0 } }, { s: { r: 0, c: 1 }, e: { r: 1, c: 1 } }];
  const cols = [{ wch: 34 }, { wch: 7 }];
  const pctCols = [], moneyCols = [], intCols = [1]; // col 1 = Số KH (số nguyên)
  let c = 2;
  for (let i = 0; i < 12; i++) {
    if (hasAct(i)) {
      H1.push(MONTH_LABELS[i], '', ''); H2.push('KH', 'TH', '% TH');
      merges.push({ s: { r: 0, c }, e: { r: 0, c: c + 2 } });
      cols.push({ wch: 10 }, { wch: 10 }, { wch: 7 });
      moneyCols.push(c, c + 1); pctCols.push(c + 2); c += 3;
    } else {
      H1.push(MONTH_LABELS[i]); H2.push('KH');
      cols.push({ wch: 10 }); moneyCols.push(c); c += 1;
    }
  }
  H1.push('Luỹ kế YTD', '', '', '', '', ''); H2.push('KH', 'TH', '% TH YTD', 'tốc độ TH YTD', 'tốc độ KH YTD', 'CL tốc độ');
  merges.push({ s: { r: 0, c }, e: { r: 0, c: c + 5 } });
  cols.push({ wch: 12 }, { wch: 12 }, { wch: 9 }, { wch: 13 }, { wch: 13 }, { wch: 9 });
  moneyCols.push(c, c + 1); pctCols.push(c + 2, c + 3, c + 4, c + 5); c += 6;
  for (const t of [['KH update', 12], ['KH đầu năm', 12], ['Chênh lệch', 12]]) {
    H1.push(t[0]); H2.push('');
    merges.push({ s: { r: 0, c }, e: { r: 1, c } });
    cols.push({ wch: t[1] }); moneyCols.push(c); c += 1;
  }
  for (const t of [['Tổng Quota', 11], ['KH còn lại YTD', 14], ['Khả dụng còn lại', 16]]) {
    H1.push(t[0]); H2.push('');
    merges.push({ s: { r: 0, c }, e: { r: 1, c } });
    cols.push({ wch: t[1] }); intCols.push(c); c += 1;
  }
  H1.push('Giải trình'); H2.push('');
  merges.push({ s: { r: 0, c }, e: { r: 1, c } });
  cols.push({ wch: 40 }); c += 1;
  const LAST_COL = c - 1;
  const aoa = [H1, H2];
  const levels = [null, null];
  const push = (level, label, d, note) => {
    const dt = Number(d.dt) || 0, ch = (Number(d.dtUpd) || 0) - dt;
    const khYtdDt = Number(d.khYtdDt) || 0, dtYtd = Number(d.dtYtd) || 0;
    const row = ['   '.repeat(level) + label, Number.isFinite(d.custCount) ? d.custCount : ''];
    for (let i = 0; i < 12; i++) {
      const kh = d.moKhDt[i] || 0, act = d.moActDt[i] || 0;
      if (!hasAct(i)) { row.push(tr(kh)); continue; }
      row.push(tr(kh), tr(act), kh > 0 ? act / kh : '');
    }
    const dtUpd = Number(d.dtUpd) || 0;
    const thP = khYtdDt > 0 ? dtYtd / khYtdDt : null;   // % TH YTD = TH YTD / KH YTD
    const tdTh = dtUpd > 0 ? dtYtd / dtUpd : null;       // tốc độ TH YTD = TH YTD / KH update cả năm
    const tdKh = dtUpd > 0 ? khYtdDt / dtUpd : null;     // tốc độ KH YTD = KH YTD / KH update cả năm
    const clP = (tdTh != null && tdKh != null) ? tdTh - tdKh : ''; // CL tốc độ
    row.push(tr(khYtdDt), tr(dtYtd), thP == null ? '' : thP, tdTh == null ? '' : tdTh, tdKh == null ? '' : tdKh, clP);
    row.push(tr(dtUpd), tr(dt), tr(ch));
    row.push(Math.round(d.quotaFY || 0), Math.round(d.khLeft || 0), d.quotaAvail == null ? '-' : Math.round(d.quotaAvail));
    row.push(note || '');
    aoa.push(row);
    levels.push(level);
  };
  // Nhóm "Ngoài kế hoạch" có thêm 1 cấp KH thật → đẩy các cấp dưới thụt vào 1 bậc
  const pushCust = (level, c) => {
    const subs = c.subs || [];
    // Nhóm "Ngoài kế hoạch": cột Số KH = số KH thật bên dưới (KH thường vẫn để trống)
    push(level, c.cust + (c.custId ? ` (${c.custId})` : ''), subs.length ? { ...c, custCount: subs.length } : c, '');
    for (const s of subs) pushCust(level + 1, s);
    for (const gp of c.grps) {
      // Giải trình đi theo NHÓM SP, không phải theo khách hàng.
      push(level + 1, gp.grp, gp, gp.note);
      for (const pp of gp.prods) push(level + 2, (pp.mset ? pp.mset + ' · ' : '') + pp.prod, pp, '');
    }
  };
  for (const reg of data.regions) {
    push(0, reg.region, reg, '');
    for (const ps of reg.psList) {
      push(1, ps.ps, ps, '');
      for (const c of ps.custs) pushCust(2, c);
    }
  }
  push(0, 'TỔNG CỘNG', data.grand, '');
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges'] = merges;
  ws['!cols'] = cols;
  ws['!rows'] = levels.map(l => l == null ? {} : { level: l });
  const pctSet = new Set(pctCols), moneySet = new Set(moneyCols), intSet = new Set(intCols);
  for (let r = 2; r < aoa.length; r++) {
    for (let cc = 1; cc <= LAST_COL; cc++) {
      if (pctSet.has(cc)) _fmt(ws, r, cc, '0%');
      else if (moneySet.has(cc)) _fmt(ws, r, cc, '#,##0.###');
      else if (intSet.has(cc)) _fmt(ws, r, cc, '#,##0');
    }
  }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Tong hop theo PS');
  XLSX.writeFile(wb, `TongHop_theo_PS_${_today()}.xlsx`);
}

function exportProductSummary(data) {

  const curIdx = Math.max(0, MONTHS.indexOf(CURRENT_MONTH));
  const conLai = mo => mo.reduce((s, v, i) => (i > curIdx ? s + v : s), 0); // KH từ tháng SAU
  const hasAct = i => i <= curIdx;
  // Header 2 tầng: tháng đã qua/hiện tại gộp 3 cột con (KH update / Thực hiện / % TH), tháng tương lai 1 cột
  const H1 = ['Sản phẩm / Miền / KH'], H2 = [''];
  const merges = [{ s: { r: 0, c: 0 }, e: { r: 1, c: 0 } }];

      cols.push({ wch: 9 }, { wch: 9 }, { wch: 7 });
      pctCols.push(c + 2); c += 3;
    } else {
      H1.push(MONTH_LABELS[i]); H2.push('KH update');

  }
  H1.push('Luỹ kế YTD', '', '', '', '', ''); H2.push('KH update', 'Thực hiện', '% TH YTD', 'tốc độ TH YTD', 'tốc độ KH YTD', 'CL tốc độ');
  merges.push({ s: { r: 0, c }, e: { r: 0, c: c + 5 } });
  cols.push({ wch: 11 }, { wch: 11 }, { wch: 9 }, { wch: 13 }, { wch: 13 }, { wch: 9 });
  pctCols.push(c + 2, c + 3, c + 4, c + 5); c += 6;
  for (const t of [['Tổng Quota', 11], ['KH còn lại YTD', 14], ['Quota khả dụng còn lại', 18]]) {
    H1.push(t[0]); H2.push('');
    merges.push({ s: { r: 0, c }, e: { r: 1, c } });
    cols.push({ wch: t[1] }); c += 1;
  }
  const LAST_COL = c - 1;
  const aoa = [H1, H2];

      return m ? (n.msets.get(m) || []) : [];
    }
  };
}

// Form chọn sản phẩm (nhóm SP → bộ vật tư → sản phẩm) — dùng chung cho thẻ KH đã có
// và thẻ KH vừa thêm. KH / miền đã biết sẵn nên không hỏi lại.
// existing = Set('ps||grp||mset||prod') để chặn thêm trùng sản phẩm cho cùng 1 PS.
// Popup dùng chung (thêm khách hàng / thêm sản phẩm). Đóng bằng X, Esc, bấm nền.
function Modal({ open, onClose, title, icon, width = 560, children, footer }) {
  const h = React.createElement;
  useEffect(() => {
    if (!open) return;
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [open, onClose]);
  if (!open) return null;
  return h("div", {
    onClick: onClose,
    className: "fixed inset-0 z-50 bg-slate-900/40 flex items-start justify-center p-4 pt-20 overflow-y-auto"
  }, h("div", {
    onClick: e => e.stopPropagation(),
    style: { width, maxWidth: '100%' },
    className: "bg-white rounded-lg shadow-xl border border-slate-200"
  },
    h("div", { className: "flex items-center gap-2 px-4 py-3 border-b border-slate-100" },
      icon, h("span", { className: "text-[14px] font-semibold text-slate-800" }, title),
      h("div", { className: "flex-1" }),
      h("button", {
        onClick: onClose, title: "Đóng",
        className: "p-1 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded"
      }, h(XIcon, { size: 16 }))),
    children,
    footer));
}

// Form thêm sản phẩm (dùng trong popup ở thẻ KH và ở bước 2 của popup thêm KH).
// Chọn ĐƯỢC NHIỀU sản phẩm một lượt: mỗi dòng tick là 1 sản phẩm + 1 đơn giá riêng,
// bấm 1 lần thêm hết (mỗi sản phẩm vẫn là 12 dòng T4→T3, SL = 0).
function ProductPickerForm({ catIdx, groupsByPs, psOptions, existing, priceOf, onSubmit, prefill }) {
  const h = React.createElement;
  const opts = psOptions && psOptions.length ? psOptions : [];
  const [ps, setPs] = useState(opts.length === 1 ? opts[0] : (prefill && prefill.ps) || '');
  const [grp, setGrp] = useState((prefill && prefill.grp) || '');
  const [mset, setMset] = useState((prefill && prefill.mset) || '');
  // Thêm CẢ BỘ hay các VẬT TƯ RIÊNG LẺ trong bộ:
  //   - cả bộ    → san_pham ghi vào DB = đúng tên bộ vật tư, chỉ có 1 dòng để tick.
  //   - riêng lẻ → tick bao nhiêu vật tư trong bộ cũng được.
  const [mode, setMode] = useState('le');
  // Đơn giá theo tr.VND cho khớp mọi chỗ hiển thị, ghi DB theo VND (×1e6).
  // Nhận cả dấu phẩy thập phân kiểu vi-VN ("1,5"). Mặc định lấy đơn giá đang dùng
  // cho đúng vật tư đó trong kế hoạch (danh mục không có cột đơn giá).
  const [sel, setSel] = useState(() => new Map()); // tên SP -> đơn giá (chuỗi tr.VND)
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(0);
  const [msg, setMsg] = useState('');
  const [err, setErr] = useState('');
  // Tháng thầu là thuộc tính của NHÓM SP (ghi lên mọi dòng của nhóm) — form này
  // mỗi lần chỉ thêm trong 1 nhóm nên dùng chung cho cả lô. Không bắt buộc.
  const [mMain, setMMain] = useState('');
  const [mAdd, setMAdd] = useState('');

  const parseTr = (v) => {
    const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.'));
    return Number.isFinite(n) && n > 0 ? Math.round(n * 1e6) : null;
  };
  const fmtTr = (vnd) => (vnd ? String(vnd / 1e6).replace('.', ',') : '');

  // Nhóm SP được phép chọn = nhóm PS đó ĐANG phụ trách (lấy từ dữ liệu kế hoạch, vốn
  // đã lọc theo team đang xem) ∩ danh mục. Không cho PS thêm sang nhóm không phải của mình.
  const groups = useMemo(() => {
    if (!ps) return [];
    const allowed = groupsByPs.get(ps);
    if (!allowed) return [];
    return catIdx.groups.filter(g => allowed.has(g));
  }, [catIdx, groupsByPs, ps]);
  const msets = useMemo(() => grp ? catIdx.msetsOf(grp) : [], [catIdx, grp]);
  const prods = useMemo(() => grp ? catIdx.prodsOf(grp, mset) : [], [catIdx, grp, mset]);
  // NO_MSET chỉ là nhãn hiển thị cho nhóm không phân loại → ghi DB là rỗng.
  const msetVal = mset === NO_MSET ? '' : mset;
  // "cả bộ" chỉ có nghĩa với một bộ vật tư THẬT: chưa chọn bộ, hoặc bộ là rổ
  // "Vật tư riêng lẻ - ..." thì luôn ở chế độ chọn từng vật tư.
  const looseOnly = isLooseSet(msetVal);
  const canWholeSet = !!msetVal && !looseOnly;
  useEffect(() => { if (!canWholeSet && mode === 'bo') setMode('le'); }, [canWholeSet, mode]);

  // Danh sách dòng để tick: cả bộ → đúng 1 dòng là tên bộ; riêng lẻ → các vật tư trong bộ.
  const items = useMemo(() => {
    if (!grp) return [];
    if (mode === 'bo') return canWholeSet ? [msetVal] : [];
    const seen = new Set();
    const out = [];
    for (const c of prods) {
      if (c.prod && !seen.has(c.prod)) { seen.add(c.prod); out.push(c.prod); }
    }
    return out;
  }, [grp, mode, prods, msetVal, canWholeSet]);
  const isDup = (name) => !!(existing && existing.has(`${ps}||${grp}||${msetVal}||${name}`));
  const conTrong = useMemo(() => items.filter(n => !isDup(n)), [items, existing, ps, grp, msetVal]);

  // Đổi PS / nhóm / bộ / kiểu chọn thì bỏ hết tick cũ (không còn hợp lệ).
  useEffect(() => { setSel(new Map()); setMsg(''); setErr(''); }, [ps, grp, mset, mode]);

  // Prefill.prod (từ modal OOP → ly_do=thieu_dong_ke_hoach): sau khi items có,
  // tự tick sản phẩm này để user chỉ cần nhập đơn giá và bấm Xác nhận.
  // Chỉ chạy một lần cho mỗi prefill mới (theo ref) để không đè lên thao tác của user.
  const prefillProdRef = useRef(null);
  useEffect(() => {
    const p = prefill && prefill.prod;
    if (!p || !items.length) return;
    if (prefillProdRef.current === p) return;
    if (grp !== (prefill.grp || grp) || mset !== (prefill.mset || mset)) return;
    if (items.includes(p) && !isDup(p)) {
      prefillProdRef.current = p;
      setSel(new Map([[p, fmtTr(priceOf && priceOf(grp, msetVal, p))]]));
    }
  }, [items, prefill, grp, mset]);

  const toggle = (name) => setSel(prev => {
    const n = new Map(prev);
    if (n.has(name)) n.delete(name);
    else n.set(name, fmtTr(priceOf && priceOf(grp, msetVal, name)));
    return n;
  });
  const setPrice = (name, v) => setSel(prev => {
    const n = new Map(prev);
    n.set(name, v);
    return n;
  });
  const chonHet = () => setSel(prev => prev.size >= conTrong.length
    ? new Map()
    : new Map(conTrong.map(n => [n, fmtTr(priceOf && priceOf(grp, msetVal, n))])));

  const thieuGia = useMemo(
    () => Array.from(sel.entries()).filter(([, v]) => parseTr(v) == null).map(([k]) => k),
    [sel]
  );
  const ready = !!ps && !!grp && sel.size > 0 && thieuGia.length === 0 && !busy;
  const lbl = "block text-[10.5px] uppercase tracking-wide text-slate-500 font-medium mb-1";
  const sels = "w-full px-2.5 py-2 text-[13px] border border-slate-200 rounded-md bg-white outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 disabled:bg-slate-50";

  const confirm = async () => {
    if (!ready) return;
    setBusy(true); setMsg(''); setErr(''); setDone(0);
    const list = Array.from(sel.entries());
    let ok = 0;
    for (const [name, priceTr] of list) {
      const res = await onSubmit({ ps, grp, mset: msetVal, prod: name, price: parseTr(priceTr), mMain, mAdd });
      if (!res) { setErr(`Dừng ở "${name}" — xem thông báo lỗi phía trên.`); break; }
      ok++;
      setDone(ok);
    }
    setBusy(false);
    if (ok > 0) {
      setMsg(`Đã thêm ${ok} sản phẩm`);
      setSel(new Map()); // giữ nguyên nhóm/bộ để thêm tiếp bộ khác
    }
  };

  const radio = (v, nhan, moTa, disabled) => h("label", {
    className: "flex-1 flex items-start gap-2 px-3 py-2 rounded-md border " +
      (disabled ? "opacity-50 cursor-not-allowed border-slate-200 "
                : "cursor-pointer " + (mode === v ? "border-emerald-400 bg-emerald-50/60" : "border-slate-200 hover:bg-slate-50"))
  }, h("input", {
    type: "radio", checked: mode === v, disabled,
    onChange: () => !disabled && setMode(v),
    className: "accent-emerald-600 mt-0.5"
  }), h("span", null,
    h("span", { className: "text-[12.5px] font-medium text-slate-700 block" }, nhan),
    h("span", { className: "text-[11px] text-slate-400" }, moTa)));

  return h("div", { className: "px-4 py-3 space-y-3" },
    // --- Hàng chọn phạm vi: PS / Nhóm / Bộ vật tư, các ô bằng nhau, thẳng cột ---
    h("div", { className: `grid gap-3 ${opts.length > 1 ? 'grid-cols-3' : 'grid-cols-2'}` },
      opts.length > 1 && h("div", null,
        h("label", { className: lbl }, "PS phụ trách"),
        h("select", { value: ps, onChange: e => setPs(e.target.value), className: sels },
          h("option", { value: "" }, "— Chọn PS —"),
          opts.map(p => h("option", { key: p, value: p }, p)))),
      h("div", null,
        h("label", { className: lbl }, "Nhóm sản phẩm",
          ps && h("span", { className: "text-slate-400 normal-case tracking-normal" }, " · theo PS ", ps)),
        h("select", {
          value: grp,
          onChange: e => { setGrp(e.target.value); setMset(''); },
          disabled: !ps || groups.length === 0,
          className: sels
        }, h("option", { value: "" },
            !ps ? "— Chọn PS trước —" : groups.length ? "— Chọn nhóm —" : "(PS này chưa có nhóm SP nào)"),
          groups.map(g => h("option", { key: g, value: g }, g)))),
      h("div", null,
        h("label", { className: lbl }, "Bộ vật tư"),
        h("select", {
          value: mset,
          onChange: e => setMset(e.target.value),
          disabled: !grp || msets.length === 0,
          className: sels
        }, h("option", { value: "" }, msets.length ? "— Chọn bộ vật tư —" : "(không có)"),
          msets.map(m => h("option", { key: m, value: m }, m))))),
    // --- Tháng thầu của nhóm SP: không bắt buộc, để trống thì bỏ qua ---
    h("div", { className: "grid grid-cols-2 gap-3" },
      h("div", null,
        h("label", { className: lbl }, "Tháng thầu chính",
          h("span", { className: "text-slate-400 normal-case tracking-normal" }, " · không bắt buộc")),
        h("input", {
          type: "month", value: mMain, onChange: e => setMMain(e.target.value),
          disabled: !grp, className: sels
        })),
      h("div", null,
        h("label", { className: lbl }, "Tháng thầu bổ sung",
          h("span", { className: "text-slate-400 normal-case tracking-normal" }, " · không bắt buộc")),
        h("input", {
          type: "month", value: mAdd, onChange: e => setMAdd(e.target.value),
          disabled: !grp, className: sels
        }))),
    (mMain || mAdd) && h("p", { className: "text-[11px] text-slate-400 -mt-1" },
      "Tháng thầu ghi cho cả nhóm ", h("span", { className: "font-medium text-slate-600" }, grp),
      " của khách hàng này — sửa lại được ở thẻ KH sau khi thêm."),
    // --- Kiểu thêm: tách hẳn thành 2 lựa chọn cho dễ nhìn, không nhét cạnh nhãn nữa ---
    h("div", { className: "flex gap-2" },
      radio('le', 'Vật tư riêng lẻ', 'chọn từng vật tư trong bộ', false),
      radio('bo', 'Cả bộ',
        canWholeSet ? 'ghi 1 dòng tên bộ vật tư'
          : looseOnly ? 'bộ này vốn là vật tư lẻ' : 'chọn bộ vật tư trước',
        !canWholeSet)),
    // --- Danh sách tick + đơn giá từng dòng ---
    h("div", null,
      h("div", { className: "flex items-end justify-between mb-1" },
        h("label", { className: lbl + " mb-0" }, "Sản phẩm ",
          h("span", { className: "text-slate-400 normal-case tracking-normal" }, "· tick nhiều dòng để thêm một lượt")),
        conTrong.length > 1 && h("button", {
          onClick: chonHet,
          className: "text-[11.5px] text-emerald-700 hover:underline"
        }, sel.size >= conTrong.length ? "Bỏ chọn tất cả" : "Chọn tất cả")),
      h("div", { className: "border border-slate-200 rounded-md max-h-[52vh] min-h-[8rem] overflow-y-auto divide-y divide-slate-100" },
        items.length === 0
          ? h("div", { className: "px-3 py-6 text-center text-[12.5px] text-slate-400" },
              !grp ? "Chọn nhóm sản phẩm để bắt đầu" : "Bộ này chưa có vật tư trong danh mục")
          : items.map(name => {
              const dup = isDup(name);
              const on = sel.has(name);
              const goiY = priceOf ? priceOf(grp, msetVal, name) : null;
              return h("div", {
                key: name,
                className: "flex items-center gap-2 px-3 py-1.5 " + (dup ? "bg-slate-50" : on ? "bg-emerald-50/40" : "")
              },
                h("input", {
                  type: "checkbox", checked: on, disabled: dup || busy,
                  onChange: () => toggle(name),
                  className: "accent-emerald-600 flex-shrink-0"
                }),
                h("span", {
                  className: "flex-1 min-w-0 truncate text-[12.5px] " + (dup ? "text-slate-400" : "text-slate-700"),
                  title: name
                }, name),
                dup
                  ? h("span", { className: "text-[11px] text-amber-600 flex-shrink-0" }, "đã có trong kế hoạch")
                  : h(React.Fragment, null,
                      h("input", {
                        value: on ? (sel.get(name) || '') : fmtTr(goiY),
                        onChange: e => setPrice(name, e.target.value),
                        disabled: !on || busy,
                        inputMode: "decimal",
                        placeholder: goiY ? "" : "nhập giá",
                        title: goiY ? "Giá đang dùng cho vật tư này trong kế hoạch"
                                    : "Vật tư này chưa có đơn giá trong kế hoạch — nhập tay",
                        className: "w-24 px-2 py-1 text-[12.5px] text-right border rounded-md outline-none focus:border-emerald-500 " +
                          (on && parseTr(sel.get(name)) == null ? "border-amber-400 bg-amber-50"
                            : on && goiY ? "border-slate-200 bg-emerald-50/60" : "border-slate-200")
                      }),
                      h("span", { className: "text-[11px] text-slate-400 w-11 flex-shrink-0" }, "tr.VND")));
            }))),
    // --- Chân form ---
    h("div", { className: "flex items-center gap-3 flex-wrap" },
      sel.size > 0 && h("span", { className: "text-[12px] text-slate-600" },
        "Đã chọn ", h("span", { className: "font-semibold text-slate-800" }, sel.size), " sản phẩm · ",
        sel.size * 12, " dòng (T4→T3), SL = 0"),
      thieuGia.length > 0 && h("span", { className: "text-[12px] text-amber-600" },
        "Còn ", thieuGia.length, " dòng chưa có đơn giá"),
      err && h("span", { className: "text-[12px] text-red-600" }, err),
      msg && h("span", { className: "text-[12px] text-emerald-600" }, msg),
      h("div", { className: "flex-1" }),
      h("button", {
        onClick: confirm,
        disabled: !ready,
        className: "flex items-center gap-1.5 px-4 py-1.5 text-[13px] font-semibold bg-emerald-600 hover:bg-emerald-700 text-white rounded-md disabled:opacity-50"
      }, busy
        ? h(React.Fragment, null, h(Loader2, { size: 14, className: "animate-spin" }), ` Đang thêm ${done}/${sel.size}…`)
        : h(React.Fragment, null, h(Plus, { size: 14 }), sel.size > 1 ? ` Thêm ${sel.size} sản phẩm` : " Thêm sản phẩm"))));
}

// Panel "Thêm khách hàng": chọn KH + PS + miền. Chưa ghi DB (schema không có bảng
// riêng cho KH của kế hoạch — KH chỉ tồn tại khi có dòng sản phẩm), chỉ tạo 1 thẻ KH
// tạm ở đầu danh sách để người dùng thêm sản phẩm ngay tại đó.
// Popup "Thêm khách hàng" — mở từ nút trên thanh bộ lọc (màn chi tiết).
// KH mới CHƯA vào DB: bấm Xác nhận chỉ tạo thẻ KH tạm ở client, phải thêm sản
// phẩm đầu tiên thì mới thực sự ghi (xem NewCustomerCard).
// KHÔNG có ô Miền: miền là thuộc tính của PS, suy từ PS đã chọn (PS nào có nhiều
// miền thì rơi về miền đã khai báo trong địa bàn); client không suy được thì để
// trống, server tự điền bằng mienForPs().
function AddCustomerModal({ open, onClose, customers, psOptions, regionsByPs, diaBanByCust, existingCustKeys, catIdx, groupsByPs, priceOf, onAdd, onAddProduct, prefill }) {
  const h = React.createElement;
  const [custKey, setCustKey] = useState('');
  const [ps, setPs] = useState(psOptions && psOptions.length === 1 ? psOptions[0] : '');
  const [step, setStep] = useState(1);   // 1 = chọn KH/PS, 2 = thêm sản phẩm đầu tiên
  const [added, setAdded] = useState(0); // số SP đã thêm trong lần mở này
  // Mỗi lần mở lại là một lần thêm mới → xoá lựa chọn cũ, TRỪ KHI có prefill từ
  // modal OOP (thieu_dong_ke_hoach): điền sẵn KH + PS + nhóm SP và nhảy thẳng step 2.
  useEffect(() => {
    if (!open) return;
    if (prefill && (prefill.custId || prefill.cust)) {
      setCustKey(prefill.custId || prefill.cust);
      if (prefill.ps) setPs(prefill.ps);
      setStep(2);
    } else {
      setCustKey('');
      setPs(psOptions && psOptions.length === 1 ? psOptions[0] : '');
      setStep(1);
    }
    setAdded(0);
  }, [open, prefill]);
  const cust = useMemo(() => customers.find(c => (c.custId || c.cust) === custKey), [customers, custKey]);
  // Địa bàn đã khai báo cho KH này (dm_dia_ban) — nguồn chuẩn cho PS/Miền.
  const terr = useMemo(
    () => (cust && diaBanByCust && diaBanByCust.get(dbCustKey(cust.custId, cust.cust))) || null,
    [diaBanByCust, cust]
  );
  // Chọn KH → tự điền PS nếu địa bàn chỉ khai báo đúng 1 PS cho KH đó.
  useEffect(() => {
    if (terr && terr.ps.length === 1) setPs(terr.ps[0]);
  }, [terr]);
  const psRegions = useMemo(() => (ps && regionsByPs.get(ps)) || [], [regionsByPs, ps]);
  const region = psRegions.length === 1 ? psRegions[0]
    : (terr && terr.mien.length === 1 ? terr.mien[0] : '');
  const already = !!(cust && (existingCustKeys.has(custLabel(cust.custId, cust.cust)) || (cust.custId && existingCustKeys.has(cust.custId))));
  const lbl = "block text-[10.5px] uppercase tracking-wide text-slate-500 font-medium mb-1";
  const sel = "w-full px-2.5 py-2 text-[13px] border border-slate-200 rounded-md bg-white outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 disabled:bg-slate-50";
  const ready = !!cust && !!ps && !already;
  // Bỏ qua bước sản phẩm → chỉ tạo thẻ KH tạm ở client (chưa ghi DB)
  const chiThemKH = () => {
    if (!ready) return;
    onAdd({ custId: cust.custId || '', cust: cust.cust, ps, region });
    onClose();
  };
  const themSanPham = async (sp) => {
    const ok = await onAddProduct({ ...sp, custId: cust.custId || '', cust: cust.cust, region });
    if (ok) setAdded(n => n + 1);
    return ok;
  };
  const coDanhMuc = !!(catIdx && groupsByPs);
  return h(Modal, {
    open, onClose,
    title: step === 1 ? "Thêm khách hàng" : `Sản phẩm đầu tiên · ${cust ? custLabel(cust.custId, cust.cust) : ''}`,
    icon: h(UserPlus, { size: 16, className: "text-emerald-600" }),
    width: step === 1 ? 520 : 760,
    footer: step === 1
      ? h("div", { className: "flex items-center gap-2 px-4 py-3 border-t border-slate-100" },
          h("div", { className: "flex-1" }),
          h("button", {

          }, coDanhMuc ? "Xác nhận & thêm SP" : h(React.Fragment, null, h(Plus, { size: 14 }), "Xác nhận")))
      : h("div", { className: "flex items-center gap-2 px-4 py-3 border-t border-slate-100" },

            : h("span", { className: "text-[12px] text-slate-400" }, "Chưa thêm sản phẩm nào thì khách hàng chưa vào kế hoạch"),
          h("div", { className: "flex-1" }),

            className: "px-3 py-1.5 text-[13px] text-slate-600 hover:bg-slate-100 rounded-md"
          }, "Quay lại"),

            className: "px-4 py-1.5 text-[13px] font-semibold text-emerald-700 border border-emerald-200 rounded-md hover:bg-emerald-50"
          }, added > 0 ? "Xong" : "Bỏ qua, thêm SP sau"))
  },
    step === 1
      ? h("div", { className: "px-4 py-3 space-y-3" },

            h(CustomerPicker, { customers, value: custKey, onChange: setCustKey, className: sel })),
          h("div", null,
            h("label", { className: lbl }, "PS phụ trách",
              terr && terr.ps.length === 1 && h("span", { className: "text-slate-400 normal-case tracking-normal" }, " · theo địa bàn")),
            h("select", { value: ps, onChange: e => setPs(e.target.value), disabled: !cust, className: sel },
              h("option", { value: "" }, "— Chọn PS —"),
              // PS đã khai báo địa bàn cho KH này lên đầu; vẫn cho chọn PS khác vì
              // địa bàn có thể chưa khai báo kịp (màn "Cấu hình địa bàn" để bù).
              terr && terr.ps.length > 0 && h("optgroup", { label: "Theo địa bàn đã khai báo" },
                terr.ps.map(p => h("option", { key: 'd:' + p, value: p }, p))),
              h("optgroup", { label: "Tất cả PS" },
                (psOptions || []).map(p => h("option", { key: p, value: p }, p)))),
            ps && h("p", { className: "text-[11px] text-slate-400 mt-1" },
              region ? `Miền: ${region} (theo PS)` : 'Miền suy theo PS khi lưu')),
          already && h("p", { className: "text-[12px] text-amber-600" },
            "Khách hàng này đã có trong kế hoạch — dùng nút “Thêm SP” ở thẻ của họ."))
      // Bước 2 dùng lại đúng form thêm SP của thẻ KH: thêm được liên tiếp nhiều SP,
      // mỗi lần bấm "Thêm sản phẩm" là ghi thật xuống DB.
      // prefill (từ modal OOP → thieu_dong_ke_hoach): điền sẵn nhóm/bộ/SP để user
      // chỉ cần nhập đơn giá và bấm Xác nhận.
      : h(ProductPickerForm, {
          catIdx, groupsByPs, psOptions: [ps], existing: null, priceOf,
          onSubmit: themSanPham, prefill
        }));

// Thẻ KH vừa thêm nhưng CHƯA có sản phẩm nào → chưa có dòng nào trong DB.

// ============ CẤU HÌNH ĐỊA BÀN (Khách hàng × Ngành hàng → PS, có thời gian hiệu lực) ============
// dm_dia_ban khai báo ai phụ trách ngành hàng nào của khách hàng nào, VÀ TỪ THÁNG
// NÀO ĐẾN THÁNG NÀO. Đổi người phụ trách giữa năm KHÔNG sửa bản cũ mà "Chuyển PS":
// đóng bản cũ ở tháng liền trước + mở bản mới → tháng cũ vĩnh viễn thuộc PS cũ, dù
// sau đó cấu hình đổi bao nhiêu lần.
//
// Kế hoạch KHÔNG tự đổi theo khai báo: phải bấm "Áp dụng", và mỗi bản chỉ ghi vào
// các tháng nó phủ nên bản mới không bao giờ ghi đè tháng đã qua (khoá khớp actual
// tháng|PS|maKH|bộVT|SP của quá khứ được giữ nguyên).
//
// Ràng buộc: tổ hợp (KH × ngành hàng) ĐÃ khai báo thì MỌI tháng đang có dòng kế
// hoạch phải được một bản nào đó phủ. Thiếu tháng = "khoảng trống" → backend chặn
// lưu; màn hình cảnh báo ngay tại chỗ để không phải thử rồi mới biết.
const MAX_DIA_BAN_ROWS = 500; // bảng phẳng (không gập nhóm như màn chi tiết) → phải có trần
const MO_ALL = 'all';         // giá trị ô "Xem theo tháng" = xem cả lịch sử

// Khoá đối chiếu khách hàng giữa dm_dia_ban và sale_target: ưu tiên mã KH, rỗng
// thì rơi về tên GỐC trong DB (cust đã fmtCust không dùng được để so khớp).
// Phải khớp đúng cột sinh cust_key của dm_dia_ban.
const dbCustKey = (custId, cust) => String(custId || '').trim() || String(cust || '').trim();
// '2026-07' -> 'T7/26'
const fmtMo = mo => {
  if (!mo) return '';
  const p = String(mo).split('-');
  return p.length < 2 ? String(mo) : 'T' + Number(p[1]) + '/' + p[0].slice(2);
};
const fmtHieuLuc = (tu, den) => (tu ? fmtMo(tu) : fmtMo(MONTHS[0])) + ' → ' + (den ? fmtMo(den) : 'nay');
// Bản khai báo có phủ tháng mo không (tu rỗng = từ đầu năm, den rỗng = còn hiệu lực)
const phuThang = (v, mo) => (!v.tuThang || v.tuThang <= mo) && (!v.denThang || v.denThang >= mo);
// Tháng đang có kế hoạch mà không bản nào phủ. versions rỗng = chưa khai báo gì →
// KHÔNG tính là khoảng trống (đó là mục "chưa khai báo", backend cũng bỏ qua).
const khoangTrong = (planMonths, versions) => {
  if (!planMonths || planMonths.size === 0 || !versions || versions.length === 0) return [];
  return MONTHS.filter(mo => planMonths.has(mo) && !versions.some(v => phuThang(v, mo)));
};

// Dịch lỗi backend địa bàn sang câu cho người cấu hình. Loại có CHI TIẾT (thiếu
// tháng nào, tháng nào không hợp lệ) được backend trả nguyên văn kèm dữ liệu cụ thể
// → chỉ bỏ tiền tố mã lỗi, giữ nguyên phần nội dung.
const diaBanErrMsg = m => {
  const s = String(m || '');
  if (s === 'dup_dia_ban') return 'địa bàn này đã được khai báo cho PS đó từ cùng một tháng.';
  if (s === 'forbidden') return 'chỉ admin được sửa cấu hình địa bàn.';
  if (s === 'forbidden_rows') return 'có dòng ngoài phạm vi quyền của bạn.';
  if (s === 'thieu_du_lieu') return 'thiếu khách hàng / ngành hàng / PS.';
  if (s === 'khong_ton_tai') return 'bản khai báo này không còn tồn tại — hãy tải lại.';
  if (s.startsWith('khoang_trong:')) {
    return 'sẽ có tháng không ai phụ trách — ' + s.slice('khoang_trong:'.length).trim();
  }
  const i = s.indexOf(':');
  if (i > 0 && /^[a-z_]+$/.test(s.slice(0, i))) return s.slice(i + 1).trim();
  return s;
};

// mienByPs: PS -> Miền (suy từ dữ liệu kế hoạch, chỉ khi PS đó thuộc đúng 1 miền).
// Miền KHÔNG phải trường nhập tay: nó là thuộc tính của PS, chọn tay chỉ tạo cơ hội
// gán lệch miền cho cùng một PS. Backend cũng tự suy lại khi lưu, không tin client.
function DiaBanView({
  rows, diaBan, customers, psOptions, mienByPs, psKnown, groupOptions, canEdit,
  psFilter, regionFilter, groupFilter, custFilter, onSave, onDelete, onDopChongLan, busy,
  prefill, onPrefillDone
}) {
  const h = React.createElement;
  // PS lạ = có trong kế hoạch/khai báo nhưng KHÔNG có trong danh mục dm_ps.
  // psKnown rỗng (chưa tải được danh mục) → không kiểm tra, tránh báo động nhầm.
  const psLa = ps => psKnown && psKnown.size > 0 && !psKnown.has(String(ps || '').trim().toLowerCase());
  // Từ 2026-08-07: bỏ chia theo tháng. Cấu hình áp cho cả năm, save = auto apply.
  // Các state theo tháng (viewMo/move) đã gỡ; nRow không còn tu_thang (backend
  // tự set '2026-04' khi insert).
  const [edits, setEdits] = useState({}); // { id: ps } — PS đã đổi, chưa lưu
  const [search, setSearch] = useState('');
  const [showMissing, setShowMissing] = useState(false);
  const [closed, setClosed] = useState(() => new Set()); // KH đang gập
  // Modal "Thêm địa bàn" — cho thêm NHIỀU dòng trong 1 lượt lưu. Nút "+ Thêm dòng"
  // thêm ô mới; Xác nhận gửi toàn bộ danh sách vào onSave (backend auto-apply cả
  // năm cho tất cả tổ hợp không chồng lấn).
  const [addOpen, setAddOpen] = useState(false);
  const emptyAddRow = { custKey: '', grp: '', ps: '' };
  const [addRows, setAddRows] = useState([emptyAddRow]);
  // Ref để scroll dòng khai báo cần chú ý (prefill purpose='chuyen') vào tầm nhìn.
  const highlightRef = useRef(null);

  // Prefill từ modal OOP:
  //  purpose='add'    → mở modal Thêm địa bàn với 1 dòng điền sẵn (KH + grp).
  //  purpose='chuyen' → tìm KH đó trong bảng, mở nhóm KH đó, scroll + highlight.
  useEffect(() => {
    if (!prefill) return;
    if (prefill.purpose === 'chuyen') {
      setSearch(prefill.custId || '');
      const custKey = dbCustKey(prefill.custId, prefill.cust);
      setClosed(prev => {
        if (!prev.has(custKey)) return prev;
        const next = new Set(prev); next.delete(custKey); return next;
      });
      setTimeout(() => {
        const el = highlightRef.current;
        if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 100);
    } else {
      // 'add' hoặc mặc định — mở modal Thêm địa bàn với 1 dòng điền sẵn
      setAddRows([{ custKey: prefill.custId || prefill.cust || '', grp: prefill.grp || '', ps: '' }]);
      setAddOpen(true);
    }
    if (onPrefillDone) onPrefillDone();
  }, [prefill]);

  // (Khách hàng × ngành hàng) -> PS đang THẬT SỰ có dòng kế hoạch, TÁCH THEO THÁNG
  // (khai báo có khoảng hiệu lực nên đối chiếu cũng phải theo tháng).
  const planIdx = useMemo(() => {
    const m = new Map();
    rows.forEach(r => {
      if (!r.grp || !r.ps || !r.mo) return;
      const k = dbCustKey(r.custId, r.custRaw || r.cust);
      if (!k) return;
      const mk = k + '||' + r.grp;
      let e = m.get(mk);
      if (!e) {
        e = { custId: r.custId || '', cust: r.custRaw || r.cust, grp: r.grp, mien: r.region || '',
              psByMonth: new Map(), months: new Set() };
        m.set(mk, e);
      }
      e.months.add(r.mo);
      let s = e.psByMonth.get(r.mo);
      if (!s) { s = new Set(); e.psByMonth.set(r.mo, s); }
      s.add(r.ps);
    });
    return m;
  }, [rows]);

  // Mọi bản khai báo của một tổ hợp (KHÔNG lọc theo tháng đang xem) — dùng để tính
  // khoảng trống và để biết tổ hợp đã khai báo hay chưa.
  const cfgByPair = useMemo(() => {
    const m = new Map();
    diaBan.forEach(d => {
      const k = dbCustKey(d.custId, d.cust) + '||' + d.grp;
      let a = m.get(k);
      if (!a) { a = []; m.set(k, a); }
      a.push(d);
    });
    return m;
  }, [diaBan]);

  // Có kế hoạch nhưng CHƯA khai báo địa bàn. Suy khai báo theo TỪNG KHOẢNG THÁNG
  // LIÊN TIẾP của mỗi PS trong kế hoạch → khai báo lại đúng lịch sử, không tạo
  // khoảng trống và không tạo chồng lấn vô cớ.
  const missing = useMemo(() => {
    // Bỏ khoảng thời gian: mỗi (tổ hợp × PS) chỉ cần 1 dòng khai báo cho cả năm.
    // Tổ hợp có nhiều PS trong kế hoạch → mỗi PS 1 dòng (khai báo → ambiguous,
    // user tự dọn).
    const out = [];
    planIdx.forEach((e, pairKey) => {
      if (cfgByPair.has(pairKey)) return;
      const psSet = new Set();
      e.psByMonth.forEach(s => s.forEach(p => psSet.add(p)));
      psSet.forEach(ps => out.push({ custId: e.custId, cust: e.cust, grp: e.grp, ps }));
    });
    return out.sort((a, b) => (a.cust || '').localeCompare(b.cust || '') ||
                              a.grp.localeCompare(b.grp) || a.ps.localeCompare(b.ps));
  }, [planIdx, cfgByPair]);

  // Danh sách hiển thị: mọi bản khai báo qua bộ lọc chung + ô tìm kiếm, kèm
  // trạng thái đối chiếu kế hoạch. Bỏ chia theo tháng: đối chiếu trên TOÀN BỘ
  // tháng của tổ hợp (không giới hạn theo tu_thang/den_thang của bản).
  const list = useMemo(() => {
    const q = deaccent(search.trim());
    const out = [];
    for (const d of diaBan) {
      const ps = edits[d.id] || d.ps;
      const mien = mienByPs.get(ps) || d.mien || '';
      if (!inSel(regionFilter, mien)) continue;
      if (!inSel(psFilter, ps)) continue;
      if (!inSel(groupFilter, d.grp)) continue;
      if (!inSel(custFilter, custLabel(d.custId, d.cust))) continue;
      if (q && !(deaccent(d.cust).includes(q) || deaccent(custLabel(d.custId, d.cust)).includes(q) ||
                 deaccent(d.custId).includes(q) ||
                 deaccent(ps).includes(q) || deaccent(d.grp).includes(q))) continue;
      const plan = planIdx.get(dbCustKey(d.custId, d.cust) + '||' + d.grp);
      let status = 'noplan', planPs = [];
      if (plan) {
        // Gom tất cả PS trong kế hoạch của tổ hợp — apply cả năm nên xét cả năm.
        const inAll = new Set();
        plan.psByMonth.forEach(s => s.forEach(p => inAll.add(p)));
        if (inAll.size === 0) status = 'noplan';
        else if (inAll.size === 1 && inAll.has(ps)) status = 'ok';
        else {
          status = 'diff';
          planPs = Array.from(inAll).filter(p => p !== ps);
          if (!planPs.length) planPs = Array.from(inAll);
        }
      }
      out.push({ ...d, ps, mien, status, planPs });
    }
    return out;
  }, [diaBan, edits, mienByPs, planIdx, search, psFilter, regionFilter, groupFilter, custFilter]);

  // Gom theo KHÁCH HÀNG: 1 KH thường có nhiều ngành hàng (và có thể khác PS mỗi
  // ngành) → xem theo nhóm dễ soát hơn bảng phẳng lặp tên KH ở mọi dòng.
  const groups = useMemo(() => {
    const m = new Map();
    for (const d of list) {
      const k = dbCustKey(d.custId, d.cust);
      let g = m.get(k);
      if (!g) { g = { key: k, custId: d.custId, cust: d.cust, rows: [], diff: 0, gaps: [] }; m.set(k, g); }
      g.rows.push(d);
      if (d.status === 'diff') g.diff++;
    }
    const arr = Array.from(m.values());
    arr.forEach(g => {
      g.rows.sort((a, b) => a.grp.localeCompare(b.grp) || a.ps.localeCompare(b.ps));
    });
    arr.sort((a, b) => custLabel(a.custId, a.cust).localeCompare(custLabel(b.custId, b.cust)));
    return arr;
  }, [list]);

  // Trần hiển thị tính theo dòng nhưng CẮT Ở RANH GIỚI KHÁCH HÀNG (không hiện nửa KH).
  const shownGroups = useMemo(() => {
    const out = [];
    let n = 0;
    for (const g of groups) {
      if (n >= MAX_DIA_BAN_ROWS) break;
      out.push(g);
      n += g.rows.length;
    }
    return out;
  }, [groups]);
  const shownRows = shownGroups.reduce((s, g) => s + g.rows.length, 0);
  const allClosed = closed.size >= shownGroups.length && shownGroups.length > 0;

  // Bỏ khoảng trống + diffIds: cấu hình tự apply cả năm sau save, không còn khái
  // niệm "thiếu tháng" hay "áp dụng thủ công".
  // Đếm tổ hợp chồng lấn (>1 PS distinct trong cùng bu × cust_key × nhóm) để
  // hiện nút "Dọn chồng lấn". Tính trên TOÀN BỘ diaBan (không phụ thuộc filter).
  const overlapCount = useMemo(() => {
    const m = new Map();
    diaBan.forEach(d => {
      if (d.active === false) return;
      const k = d.bu + '|' + dbCustKey(d.custId, d.cust) + '|' + d.grp;
      if (!m.has(k)) m.set(k, new Set());
      m.get(k).add(d.ps);
    });
    let n = 0;
    m.forEach(s => { if (s.size > 1) n++; });
    return n;
  }, [diaBan]);
  const editCount = Object.keys(edits).length;
  const custCount = groups.length;
  const psLaList = useMemo(
    () => Array.from(new Set(list.filter(d => psLa(d.ps)).map(d => d.ps))).sort(),
    [list, psKnown]
  );

  // Chỉ PS là sửa được tại chỗ (sửa sai cho CẢ khoảng hiệu lực của bản đó); đổi
  // người phụ trách giữa năm phải dùng "Chuyển PS". Miền đi theo PS.
  const setEdit = (d, ps) => setEdits(prev => {
    if (ps === d.ps) { // về đúng giá trị gốc → bỏ khỏi danh sách chưa lưu
      const o = { ...prev };
      delete o[d.id];
      return o;
    }
    return { ...prev, [d.id]: ps };
  });
  const toggleGroup = key => setClosed(prev => {
    const next = new Set(prev);
    if (next.has(key)) next.delete(key); else next.add(key);
    return next;
  });

  const byId = useMemo(() => new Map(diaBan.map(d => [d.id, d])), [diaBan]);
  const saveEdits = async () => {
    // KHÔNG gửi mien (backend suy theo PS) và KHÔNG gửi khoảng hiệu lực (giữ nguyên).
    const payload = Object.entries(edits).map(([id, ps]) => {
      const base = byId.get(Number(id)) || {};
      return { id: Number(id), custId: base.custId, cust: base.cust, grp: base.grp, ps };
    }).filter(r => r.ps && r.grp);
    if (!payload.length) return;
    if (await onSave(payload)) setEdits({});
  };

  // Modal Thêm địa bàn — thao tác trên addRows (nhiều dòng cùng lúc).
  const custById = useMemo(() => {
    const m = new Map();
    customers.forEach(c => m.set(c.custId || c.cust, c));
    return m;
  }, [customers]);
  const setAddRowAt = (i, patch) => setAddRows(prev => prev.map((r, idx) => idx === i ? { ...r, ...patch } : r));
  const removeAddRow = i => setAddRows(prev => prev.length > 1 ? prev.filter((_, idx) => idx !== i) : prev);
  const appendAddRow = () => setAddRows(prev => prev.concat([emptyAddRow]));
  const readyRows = addRows.filter(r => r.custKey && r.grp && r.ps);
  const openAdd = () => { setAddRows([emptyAddRow]); setAddOpen(true); };
  const closeAdd = () => { setAddOpen(false); setAddRows([emptyAddRow]); };
  const saveBatch = async () => {
    if (!readyRows.length) return;
    // Backend nhận (custId, cust, grp, ps) — không gửi tuThang (mặc định 2026-04).
    const payload = readyRows.map(r => {
      const c = custById.get(r.custKey);
      return { custId: (c && c.custId) || '', cust: (c && c.cust) || r.custKey, grp: r.grp, ps: r.ps };

    const ok = await onSave(payload);
    if (ok) closeAdd();
  };

  const declareMissing = async () => {
    // Khai báo đúng những gì kế hoạch đang có → không sinh thay đổi nào cho

    if (!confirm(`Khai báo ${batch.length} địa bàn theo đúng PS đang có trong kế hoạch?`)) return;
    await onSave(batch);

  const doDelete = d => {
    if (confirm(`Xóa khai báo địa bàn "${d.grp}" của ${custLabel(d.custId, d.cust)} — PS ${d.ps}?\n\n` +

  const th = "px-2 py-2 text-[10.5px] uppercase tracking-wide text-slate-500 font-semibold whitespace-nowrap";
  const td = "px-2 py-1.5 text-[12px] border-t border-slate-100";
  const BADGE = {
    ok: ['bg-emerald-50 text-emerald-700', 'Khớp kế hoạch'],
    diff: ['bg-amber-50 text-amber-700', 'Lệch kế hoạch'],
    noplan: ['bg-slate-100 text-slate-500', 'Chưa có kế hoạch']

  const COLS = canEdit ? 5 : 4; // Ngành hàng · Miền · PS · Đối chiếu (+ thao tác)

  return h("div", { className: "px-6 pb-8" },

    h("div", { className: "bg-white rounded-lg border border-slate-200 px-3 py-2.5 mb-3 flex items-center gap-2.5 flex-wrap" },

        psLaList.length > 0 && h("span", {
          className: "text-red-600 font-medium",
          title: "PS đang được khai báo/dùng nhưng không có trong danh mục PS: " + psLaList.join(', ')

        h("div", { className: "flex-1" }),
        canEdit && h("button", {

          missing.length > MAX_DIA_BAN_ROWS ? ` (${MAX_DIA_BAN_ROWS} dòng đầu)` : '')),
      showMissing && h("div", { className: "px-3 pb-3 max-h-64 overflow-auto scroll-shadow" },
        h("table", { className: "w-full" },
          h("tbody", null, missing.slice(0, MAX_DIA_BAN_ROWS).map((m, i) =>

              h("td", { className: td + " font-mono text-slate-400 whitespace-nowrap" }, m.custId || '—'),
              h("td", { className: td + " text-slate-700" }, custLabel(m.custId, m.cust)),

    // ---- Modal Thêm địa bàn (nhiều dòng) — mở qua nút "+ Thêm địa bàn" ở toolbar

    }, h("div", {
      onClick: e => e.stopPropagation(),

    },
      h("div", { className: "px-4 py-3 border-b border-slate-100 flex items-center gap-3" },

        h("button", { onClick: closeAdd, className: "p-1 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded" },
          h(XIcon, { size: 16 }))),
      h("div", { className: "px-4 py-3 space-y-2 overflow-auto flex-1" },
        addRows.map((r, i) => {
          const cust = custById.get(r.custKey);
          const mien = (r.ps && mienByPs.get(r.ps)) || '';
          return h("div", {
            key: i,
            className: "grid grid-cols-12 gap-2 items-end p-2 rounded-md border border-slate-100 bg-slate-50/40"
          },
            h("div", { className: "col-span-12 md:col-span-4" },
              h("label", { className: lbl }, "Khách hàng"),
              h(CustomerPicker, {
                customers,
                value: r.custKey,
                onChange: v => setAddRowAt(i, { custKey: v }),
                className: sel
              })),
            h("div", { className: "col-span-6 md:col-span-3" },
              h("label", { className: lbl }, "Ngành hàng"),
              h("select", {
                value: r.grp,
                onChange: e => setAddRowAt(i, { grp: e.target.value }),
                disabled: !cust,
                className: sel
              }, h("option", { value: "" }, "— Chọn —"),
                groupOptions.map(g => h("option", { key: g, value: g }, g)))),
            h("div", { className: "col-span-6 md:col-span-4" },
              h("label", { className: lbl }, "PS phụ trách",
                mien && h("span", { className: "text-slate-400 normal-case tracking-normal" }, " · miền ", mien)),
              h("select", {
                value: r.ps,
                onChange: e => setAddRowAt(i, { ps: e.target.value }),
                disabled: !cust,
                className: sel
              }, h("option", { value: "" }, "— Chọn —"),
                psOptions.map(p => h("option", { key: p, value: p }, p)))),
            h("div", { className: "col-span-12 md:col-span-1 flex justify-end" },
              addRows.length > 1 && h("button", {
                onClick: () => removeAddRow(i),
                title: "Bỏ dòng này",
                className: "p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded"
              }, h(Trash2, { size: 14 }))));
        }),
        h("button", {
          onClick: appendAddRow,
          className: "w-full py-2 text-[12.5px] font-medium text-emerald-700 border-2 border-dashed border-emerald-200 hover:bg-emerald-50 rounded-md"
        }, "+ Thêm dòng nữa")),
      h("div", { className: "px-4 py-3 border-t border-slate-100 flex items-center gap-3" },
        h("span", { className: "text-[11.5px] text-slate-500" },
          readyRows.length, " / ", addRows.length, " dòng đầy đủ (KH · Ngành hàng · PS)"),
        h("div", { className: "flex-1" }),
        h("button", {

          className: "px-3 py-1.5 text-[13px] text-slate-600 hover:bg-slate-100 rounded-md"
        }, "Huỷ"),

        }, busy ? h(Loader2, { size: 14, className: "animate-spin" }) : h(Check, { size: 14 }),
          " Lưu ", readyRows.length, " địa bàn & áp dụng")))),

    // ---- Bảng địa bàn ----
    h("div", { className: "bg-white rounded-lg border border-slate-200 overflow-hidden" },
      h("div", { className: "overflow-auto scroll-shadow" },
        h("table", { className: "w-full" },
          h("thead", { className: "bg-slate-50 sticky top-0 z-10" },
            h("tr", null,
              h("th", { className: th }, "Khách hàng / Ngành hàng"),
              h("th", { className: th }, "Miền"),
              h("th", { className: th }, "PS phụ trách"),
              h("th", { className: th }, "Đối chiếu kế hoạch"),
              canEdit && h("th", { className: th }))),
          h("tbody", null, shownGroups.length === 0
            ? h("tr", null, h("td", {
                colSpan: COLS,

            // Mỗi khách hàng = 1 dòng tiêu đề (gập/mở) + các dòng ngành hàng của KH đó.
            : shownGroups.map(g => {
              const open = !closed.has(g.key);
              // Highlight khi prefill purpose='chuyen' trỏ về KH này — dùng ref để

              const focused = prefill && prefill.purpose === 'chuyen' &&

                      h("span", { className: "text-[11px] text-slate-400 shrink-0" }, g.rows.length, " ngành hàng")))),
                open && g.rows.map(d => {
                  const dirty = !!edits[d.id];
                  const [cls, text] = BADGE[d.status];
                  return h("tr", { key: d.id, className: dirty ? "bg-amber-50/60" : "hover:bg-slate-50/60" },

                      className: td + " text-slate-500",
                      title: "Miền lấy theo PS phụ trách, không sửa trực tiếp"
                    }, d.mien || '—'),

                      canEdit
                        ? h("select", {
                            value: d.ps,

                            title: "Sửa PS — sau khi Lưu, kế hoạch cả năm tự chuyển sang PS mới.",
                            className: cellSel + (dirty ? " border-amber-400" : " border-slate-200")
                          }, psOptions.map(p => h("option", { key: p, value: p }, p)),
                            !psOptions.includes(d.ps) && h("option", { value: d.ps }, d.ps))
                        : d.ps,
                      psLa(d.ps) && h("span", {
                        title: "PS này không có trong danh mục PS (dm_ps) — hoá đơn của họ được dịch tên theo dm_ps nên sẽ KHÔNG khớp dòng kế hoạch, số rơi hết sang \"ngoài kế hoạch\". Sửa tên trong dm_ps hoặc chọn đúng PS trong danh mục.",
                        className: "ml-1 px-1 rounded bg-red-100 text-red-700 text-[10px] font-bold cursor-help"
                      }, "!")),
                    h("td", { className: td },
                      h("span", { className: `inline-block px-1.5 py-0.5 rounded text-[10.5px] font-medium ${cls}` }, text),
                      d.status === 'diff' && h("span", { className: "text-[11px] text-slate-500 ml-1.5" },
                        "kế hoạch: ", d.planPs.join(', '),
                        h("span", { className: "opacity-70" }, " · nhiều PS chồng lấn → không tự apply"))),
                    canEdit && h("td", { className: td + " whitespace-nowrap text-right" },
                      h("button", {
                        onClick: () => doDelete(d),
                        disabled: busy,

                      }, h(Trash2, { size: 13 }))));
                }));

      list.length > shownRows && h("div", {
        className: "px-3 py-2 text-[12px] text-slate-500 bg-slate-50 border-t border-slate-100"
      }, "Đang hiện ", fmtInt(shownRows), "/", fmtInt(list.length), " dòng (", shownGroups.length, "/",
        fmtInt(groups.length), " khách hàng) — dùng bộ lọc hoặc ô tìm kiếm để thu hẹp.")));
}
