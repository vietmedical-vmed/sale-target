// Khung bảng cao gần trọn màn hình → chỉ có bảng cuộn dọc, nhờ đó header dính
// (.sticky-head) luôn nằm trong tầm nhìn.
// Chiều cao KHÔNG trừ phần thẻ số + bộ lọc phía trên (thanh tiêu đề mới là thứ dính
// lại), nếu trừ thì khung chỉ còn ~340px — lùn. Đổi lại, khi bảng dài hơn khung thì
// kéo trang xuống 1 lần cho khung nằm ngay dưới thanh tiêu đề, chiếm trọn màn hình.
// Là max-height nên bảng ngắn (layer mặc định) vẫn hiện đủ, không sinh thanh cuộn.
function useFitHeight() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let firstFit = true;
    const fit = () => {
      const vh = window.innerHeight || document.documentElement.clientHeight || 0;
      const bar = document.querySelector('header.sticky')?.offsetHeight || 0;
      const h = vh - bar - 32; // chừa lề dưới
      // Không đo được chiều cao (nhúng/snapshot) hoặc màn quá thấp → để bảng cao tự
      // nhiên như cũ, thà mất header dính còn hơn ép bảng lùn tịt.
      if (vh < 400 || h < 320) { el.style.maxHeight = ''; return; }
      el.style.maxHeight = h + 'px';
      if (firstFit && el.scrollHeight > el.clientHeight + 4) {
        const docTop = el.getBoundingClientRect().top + window.scrollY;
        // chỉ kéo xuống, không bao giờ giật ngược lên chỗ người dùng đang xem
        if (window.scrollY < docTop - bar) window.scrollTo(0, docTop - bar);
      }
      firstFit = false;
    };
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);
  return ref;
}

              ...subHead('sytd', 'bg-amber-50/40')
            )
          ),
          h('tbody', null,
            data.prods.length === 0
              ? h('tr', null, h('td', { colSpan: N_COLS, className: 'px-4 py-12 text-center text-slate-400 text-sm' }, rows.length === 0 ? 'Sheet trống' : 'Không có sản phẩm nào khớp bộ lọc'))
              : data.prods.map(p => {
                  const isOpen = open.has(p.prod);
                  const out = [
                    h('tr', { key: p.prod, className: 'bg-slate-50 cursor-pointer border-b border-slate-200', onClick: () => toggle(p.prod) },
                      h('td', { className: `px-4 py-2 text-[12.5px] font-semibold text-slate-800 ${stickyLabel('bg-slate-50')}` },
                        h('span', { className: 'inline-block w-3 text-slate-400' }, isOpen ? '▾' : '▸'), ' ', p.prod
                      ),
                      ...moCells(p, 'font-medium'),
                      ...ytdCells(p, 'font-semibold'),
                      quotaCell(p.quota, 'font-semibold text-slate-700'),
                      conLai(sumFromNow(p.moKh)),
                      khaDungCell(p, 'font-semibold text-slate-800')
                    )
                  ];
                  if (isOpen) {
                    for (const rg of p.regs) {
                      const rKey = p.prod + '||' + rg.region;
                      const rOpen = open.has(rKey);
                      const hasCust = rg.custs && rg.custs.length > 0;
                      out.push(
                        h('tr', { key: rKey, className: 'border-b border-slate-100 bg-slate-50/40' + (hasCust ? ' cursor-pointer' : ''), onClick: hasCust ? () => toggle(rKey) : undefined },
                          h('td', { className: `pl-10 pr-4 py-1.5 text-[12px] font-medium text-slate-700 ${stickyLabel('bg-slate-50')}` },
                            h('span', { className: 'inline-block w-3 text-slate-400' }, hasCust ? (rOpen ? '▾' : '▸') : ''), ' ', rg.region
                          ),
                          ...moCells(rg),
                          ...ytdCells(rg),
                          quotaCell(rg.quota),
                          conLai(sumFromNow(rg.moKh)),
                          khaDungCell(rg)
                        )
                      );
                      if (rOpen) {
                        // Nhóm "Ngoài kế hoạch" mở ra được để xem từng KH thật bên dưới
                        const custRow = (cu, key, pad, kids) => h('tr', {
                          key, className: 'border-b border-slate-100' + (kids ? ' cursor-pointer bg-amber-50/30' : ''),
                          onClick: kids ? () => toggle(key) : undefined
                        },
                          h('td', { className: `${pad} pr-4 py-1.5 text-[11.5px] text-slate-500 ${stickyLabel('bg-white')}` },
                            h('span', { className: 'inline-block w-3 text-slate-400' }, kids ? (open.has(key) ? '▾' : '▸') : ''),
                            h('span', { className: 'truncate' + (cu.cust === OOP_CUST ? ' text-amber-700 font-medium' : '') }, cu.cust), ' ',
                            cu.cust === OOP_CUST
                              ? h('span', { className: 'text-[9.5px] px-1.5 py-0.5 rounded bg-amber-100 text-amber-700 font-medium whitespace-nowrap' }, 'Ngoài KH')
                              : h('span', { className: 'text-[10px] text-slate-400 font-mono' }, cu.custId)
                          ),
                          ...moCells(cu),
                          ...ytdCells(cu),
                          quotaCell(cu.quota),
                          conLai(sumFromNow(cu.moKh)),
                          khaDungCell(cu)
                        );
                        for (const cu of rg.custs) {
                          const cKeyStr = rKey + '||' + cu.cust;
                          const subs = cu.subs || [];
                          out.push(custRow(cu, cKeyStr, 'pl-16', subs.length > 0));
                          if (subs.length && open.has(cKeyStr)) {
                            for (const s of subs) out.push(custRow(s, cKeyStr + '||' + s.cust, 'pl-24', false));
                          }
                        }
                      }
                    }
                  }
                  return out;
                }),
            h('tr', { className: 'bg-slate-800 text-white font-semibold' },
              h('td', { className: `px-4 py-2.5 text-[12.5px] border-t-2 border-slate-900 sticky left-0 z-10 bg-slate-800` }, 'TỔNG CỘNG'),
              ...(showMonths ? MONTHS.flatMap((_, i) => {
                const kh = data.grand.moKh[i], act = data.grand.moAct[i];
                const cells = [h('td', { key: 'gk' + i, className: 'px-2 py-2.5 text-right text-[12px] tabular-nums' }, fmtInt(kh))];
                if (hasAct(i)) {
                  cells.push(h('td', { key: 'ga' + i, className: 'px-2 py-2.5 text-right text-[12px] tabular-nums text-orange-200' }, fmtInt(act)));
                  cells.push(h('td', { key: 'gp' + i, className: 'px-2 py-2.5 text-right text-[11.5px] tabular-nums text-slate-300' }, pctTxt(act, kh)));
                }
                return cells;
              }) : []),
              h('td', { className: 'px-3 py-2.5 text-right text-[12.5px] tabular-nums' }, fmtInt(data.grand.khYtd)),
              h('td', { className: 'px-3 py-2.5 text-right text-[12.5px] tabular-nums text-orange-200' }, fmtInt(data.grand.thYtd)),
              h('td', { className: 'px-3 py-2.5 text-right text-[12.5px] tabular-nums' }, pctTxt(data.grand.thYtd, data.grand.khYtd)),
              h('td', { className: 'px-3 py-2.5 text-right text-[12.5px] tabular-nums' }, fmtInt(data.grand.quota)),
              h('td', { className: 'px-3 py-2.5 text-right text-[12.5px] tabular-nums' }, fmtInt(sumFromNow(data.grand.moKh))),
              h('td', { className: 'px-3 py-2.5 text-right text-[12.5px] tabular-nums' }, fmtInt((data.grand.quota || 0) - (data.grand.thYtd + sumFromNow(data.grand.moKh))))
            )
          )
        )
      )
    )
  );
}

// ============ XUẤT EXCEL — giữ cấu trúc phân cấp (gập/mở) + header gộp ============
const _ec = (r, c) => window.XLSX.utils.encode_cell({ r, c });
const _today = () => new Date().toISOString().slice(0, 10).replace(/-/g, '');
// Áp định dạng số + kiểu cho 1 ô (SheetJS community hỗ trợ number format qua .z)
const _fmt = (ws, r, c, z) => { const cell = ws[_ec(r, c)]; if (cell && cell.v !== '' && cell.v != null) cell.z = z; };

function exportSummaryPS(data) {
  const XLSX = window.XLSX;
  if (!XLSX) { alert('Chưa tải được thư viện Excel, vui lòng tải lại trang rồi thử lại.'); return; }
  const tr = v => (Number(v) || 0) / 1e6; // VND → triệu VND
  const curIdx = Math.max(0, MONTHS.indexOf(CURRENT_MONTH));
  const hasAct = i => i <= curIdx; // tháng đã qua/hiện tại: 3 cột con; tháng sau: 1 cột KH
  // ---- Header 2 tầng: giống bố cục màn hình (giá trị theo tháng & YTD = doanh thu, triệu VND) ----
  const H1 = ['Miền / PS / Khách hàng', 'Số KH'], H2 = ['', ''];
  const merges = [{ s: { r: 0, c: 0 }, e: { r: 1, c: 0 } }, { s: { r: 0, c: 1 }, e: { r: 1, c: 1 } }];
  const cols = [{ wch: 34 }, { wch: 7 }];
  const pctCols = [], moneyCols = [], intCols = [1]; // col 1 = Số KH (số nguyên)
  let c = 2;
  for (let i = 0; i < 12; i++) {
    if (hasAct(i)) {
      H1.push(MONTH_LABELS[i], '', ''); H2.push('KH', 'TH', '% TH');
      merges.push({ s: { r: 0, c }, e: { r: 0, c: c + 2 } });
      cols.push({ wch: 10 }, { wch: 10 }, { wch: 7 });
      moneyCols.push(c, c + 1); pctCols.push(c + 2); c += 3;
    } else {
      H1.push(MONTH_LABELS[i]); H2.push('KH');
      cols.push({ wch: 10 }); moneyCols.push(c); c += 1;
    }
  }
  H1.push('Luỹ kế YTD', '', ''); H2.push('KH', 'TH', '% TH');
  merges.push({ s: { r: 0, c }, e: { r: 0, c: c + 2 } });
  cols.push({ wch: 12 }, { wch: 12 }, { wch: 8 });
  moneyCols.push(c, c + 1); pctCols.push(c + 2); c += 3;
  for (const t of [['KH update', 12], ['KH đầu năm', 12], ['Chênh lệch', 12]]) {
    H1.push(t[0]); H2.push('');
    merges.push({ s: { r: 0, c }, e: { r: 1, c } });
    cols.push({ wch: t[1] }); moneyCols.push(c); c += 1;
  }
  for (const t of [['Tổng Quota', 11], ['KH còn lại YTD', 14], ['Khả dụng còn lại', 16]]) {
    H1.push(t[0]); H2.push('');
    merges.push({ s: { r: 0, c }, e: { r: 1, c } });
    cols.push({ wch: t[1] }); intCols.push(c); c += 1;
  }
  H1.push('Giải trình'); H2.push('');
  merges.push({ s: { r: 0, c }, e: { r: 1, c } });
  cols.push({ wch: 40 }); c += 1;
  const LAST_COL = c - 1;
  const aoa = [H1, H2];
  const levels = [null, null];
  const push = (level, label, d, note) => {
    const dt = Number(d.dt) || 0, ch = (Number(d.dtUpd) || 0) - dt;
    const khYtdDt = Number(d.khYtdDt) || 0, dtYtd = Number(d.dtYtd) || 0;
    const row = ['   '.repeat(level) + label, Number.isFinite(d.custCount) ? d.custCount : ''];
    for (let i = 0; i < 12; i++) {
      const kh = d.moKhDt[i] || 0, act = d.moActDt[i] || 0;
      if (!hasAct(i)) { row.push(tr(kh)); continue; }
      row.push(tr(kh), tr(act), kh > 0 ? act / kh : '');
    }
    row.push(tr(khYtdDt), tr(dtYtd), khYtdDt > 0 ? dtYtd / khYtdDt : '');
    row.push(tr(Number(d.dtUpd) || 0), tr(dt), tr(ch));
    row.push(Math.round(d.quotaFY || 0), Math.round(d.khLeft || 0), d.quotaAvail == null ? '-' : Math.round(d.quotaAvail));
    row.push(note || '');
    aoa.push(row);
    levels.push(level);
  };
  // Nhóm "Ngoài kế hoạch" có thêm 1 cấp KH thật → đẩy các cấp dưới thụt vào 1 bậc
  const pushCust = (level, c) => {
    const subs = c.subs || [];
    // Nhóm "Ngoài kế hoạch": cột Số KH = số KH thật bên dưới (KH thường vẫn để trống)
    push(level, c.cust + (c.custId ? ` (${c.custId})` : ''), subs.length ? { ...c, custCount: subs.length } : c, c.note);
    for (const s of subs) pushCust(level + 1, s);
    for (const gp of c.grps) {
      push(level + 1, gp.grp, gp, '');
      for (const pp of gp.prods) push(level + 2, (pp.mset ? pp.mset + ' · ' : '') + pp.prod, pp, '');
    }
  };
  for (const reg of data.regions) {
    push(0, reg.region, reg, '');
    for (const ps of reg.psList) {
      push(1, ps.ps, ps, '');
      for (const c of ps.custs) pushCust(2, c);
    }
  }
  push(0, 'TỔNG CỘNG', data.grand, '');
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges'] = merges;
  ws['!cols'] = cols;
  ws['!rows'] = levels.map(l => l == null ? {} : { level: l });
  const pctSet = new Set(pctCols), moneySet = new Set(moneyCols), intSet = new Set(intCols);
  for (let r = 2; r < aoa.length; r++) {
    for (let cc = 1; cc <= LAST_COL; cc++) {
      if (pctSet.has(cc)) _fmt(ws, r, cc, '0%');
      else if (moneySet.has(cc)) _fmt(ws, r, cc, '#,##0.###');
      else if (intSet.has(cc)) _fmt(ws, r, cc, '#,##0');
    }
  }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Tong hop theo PS');
  XLSX.writeFile(wb, `TongHop_theo_PS_${_today()}.xlsx`);
}

function exportProductSummary(data) {
  const XLSX = window.XLSX;
  if (!XLSX) { alert('Chưa tải được thư viện Excel, vui lòng tải lại trang rồi thử lại.'); return; }
  const curIdx = Math.max(0, MONTHS.indexOf(CURRENT_MONTH));
  const conLai = mo => mo.reduce((s, v, i) => (i > curIdx ? s + v : s), 0); // KH từ tháng SAU
  const hasAct = i => i <= curIdx;
  // Header 2 tầng: tháng đã qua/hiện tại gộp 3 cột con (KH update / Thực hiện / % TH), tháng tương lai 1 cột
  const H1 = ['Sản phẩm / Miền / KH'], H2 = [''];
  const merges = [{ s: { r: 0, c: 0 }, e: { r: 1, c: 0 } }];
  const cols = [{ wch: 34 }];
  const pctCols = [];
  let c = 1;
  for (let i = 0; i < 12; i++) {
    if (hasAct(i)) {
      H1.push(MONTH_LABELS[i], '', ''); H2.push('KH update', 'Thực hiện', '% TH');
      merges.push({ s: { r: 0, c }, e: { r: 0, c: c + 2 } });
      cols.push({ wch: 9 }, { wch: 9 }, { wch: 7 });
      pctCols.push(c + 2); c += 3;
    } else {
      H1.push(MONTH_LABELS[i]); H2.push('KH update');
      cols.push({ wch: 9 }); c += 1;
    }
  }
  H1.push('Luỹ kế YTD', '', ''); H2.push('KH update', 'Thực hiện', '% TH');
  merges.push({ s: { r: 0, c }, e: { r: 0, c: c + 2 } });
  cols.push({ wch: 11 }, { wch: 11 }, { wch: 8 });
  pctCols.push(c + 2); c += 3;
  for (const t of [['Tổng Quota', 11], ['KH còn lại YTD', 14], ['Quota khả dụng còn lại', 18]]) {
    H1.push(t[0]); H2.push('');
    merges.push({ s: { r: 0, c }, e: { r: 1, c } });
    cols.push({ wch: t[1] }); c += 1;
  }
  const LAST_COL = c - 1;
  const aoa = [H1, H2];
  const levels = [null, null];
  const push = (level, label, d) => {
    const cl = conLai(d.moKh), quota = Number(d.quota) || 0, thYtd = Number(d.thYtd) || 0, khYtd = Number(d.khYtd) || 0;
    const row = ['   '.repeat(level) + label];
    for (let i = 0; i < 12; i++) {
      const kh = Math.round(d.moKh[i] || 0);
      if (!hasAct(i)) { row.push(kh); continue; }
      const act = Math.round(d.moAct[i] || 0);
      row.push(kh, act, kh > 0 ? act / kh : '');
    }
    row.push(Math.round(khYtd), Math.round(thYtd), khYtd > 0 ? thYtd / khYtd : '');
    row.push(Math.round(quota), Math.round(cl), d.oop ? '-' : Math.round(quota - (thYtd + cl)));
    aoa.push(row);
    levels.push(level);
  };
  for (const p of data.prods) {
    push(0, p.prod, p);
    for (const rg of p.regs) {
      push(1, rg.region, rg);
      for (const cu of rg.custs) {
        push(2, cu.cust + (cu.custId ? ` (${cu.custId})` : ''), cu);
        // Nhóm "Ngoài kế hoạch": liệt kê KH thật ở cấp dưới
        for (const s of (cu.subs || [])) push(3, s.cust + (s.custId ? ` (${s.custId})` : ''), s);
      }
    }
  }
  push(0, 'TỔNG CỘNG', data.grand);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges'] = merges;
  ws['!cols'] = cols;
  ws['!rows'] = levels.map(l => l == null ? {} : { level: l });
  const pctSet = new Set(pctCols);
  for (let r = 2; r < aoa.length; r++) {
    for (let cc = 1; cc <= LAST_COL; cc++) _fmt(ws, r, cc, pctSet.has(cc) ? '0%' : '#,##0');
  }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Tong hop theo SP');
  XLSX.writeFile(wb, `TongHop_theo_SP_${_today()}.xlsx`);
}

// ============ SUMMARY (Tổng hợp theo Miền / PS / Khách hàng) ============
function SummaryView({
  rows,
  psFilter,
  regionFilter,
  custFilter,
  groupFilter,
  search,
  onExport
}) {
  const boxRef = useFitHeight();
  const data = useMemo(() => {
    const q = (search || '').toLowerCase().trim();
    const filtered = rows.filter(r => inSel(psFilter, r.ps) && inSel(regionFilter, r.region) && inSel(custFilter, r.cust) && inSel(groupFilter, r.grp) && matchSearch(r, q));
    const regMap = new Map();
    for (const r of filtered) {
      // Bỏ dòng ngoài 12 tháng của năm tài chính. Dòng kế hoạch luôn nằm trong FY,
      // chỉ dòng THỰC HIỆN NGOÀI KẾ HOẠCH mới có tháng của năm trước — mà
      // isYtdMonth('2025-07') vẫn ra true nên nếu không chặn thì doanh số năm ngoái
      // bị cộng vào Thực hiện YTD/DThu của FY này. Màn Tổng hợp theo SP đã chặn sẵn.
      if (MONTHS.indexOf(r.mo) < 0) continue;
      const rKey = r.region || '(Không rõ miền)';
      if (!regMap.has(rKey)) regMap.set(rKey, {
        region: rKey,
        psMap: new Map()
      });
      const reg = regMap.get(rKey);
      const psKey = r.ps || '(Không rõ PS)';
      if (!reg.psMap.has(psKey)) reg.psMap.set(psKey, {
        ps: psKey,
        custMap: new Map()
      });
      const ps = reg.psMap.get(psKey);
      // Dòng ngoài kế hoạch gom hết vào 1 nhóm "Ngoài kế hoạch";
      // KH thật của dòng thực hiện nằm ở cấp con ngay dưới nhóm này.
      const isOop = !!r._oop;
      const cKey = isOop ? OOP_CUST : (r.cust || '—');
      const newCust = (name, id) => ({
        cust: name,
        custId: id,
        oop: isOop, // ngoài kế hoạch → không có quota, không tính khả dụng còn lại
        note: '',
        dt: 0,
        dtYtd: 0,
        dtUpd: 0,
        quotaFY: 0,
        ytd: 0,
        khLeft: 0,
        moKhDt: MONTHS.map(() => 0), // DThu KH update từng tháng
        moActDt: MONTHS.map(() => 0), // DThu thực hiện từng tháng
        khYtdDt: 0, // DThu KH update luỹ kế YTD (để tính % TH YTD)
        prods: new Set(),
        subMap: new Map(),  // chỉ nhóm "Ngoài kế hoạch" dùng: KH thật → { grpMap }
        grpMap: new Map()   // Nhóm SP → { prodMap: Sản phẩm }
      });
      if (!ps.custMap.has(cKey)) ps.custMap.set(cKey, newCust(cKey, isOop ? '' : r.custId));
      const c = ps.custMap.get(cKey);
      if (r.mo === NOTE_MONTH && r.note) c.note = r.note;
      const price = Number(r.price) || 0; // đơn giá TỪNG DÒNG
      const mi = MONTHS.indexOf(r.mo);             // vị trí tháng (−1 nếu ngoài 12 tháng)
      const isPast = (r.mo || '') < CURRENT_MONTH; // tháng đã đóng → DThu update lấy theo thực hiện
      const inYtd = isYtdMonth(r.mo);              // luỹ kế YTD gồm cả tháng hiện tại
      const actQty = Number(r.act) || 0;
      const updQty = isPast ? actQty : r.revUpd !== undefined && r.revUpd !== '' && r.revUpd !== null ? Number(r.revUpd) || 0 : Number(r.rev) || 0;
      // KH update THÔ theo tháng (KHÔNG ép tháng đã qua = thực hiện) → giống màn SP, để % TH có nghĩa
      const planUpd = r.revUpd !== undefined && r.revUpd !== '' && r.revUpd !== null ? Number(r.revUpd) || 0 : Number(r.rev) || 0;
      // Delta của DÒNG này — dùng chung cho cả 3 cấp: KH → Nhóm SP → Sản phẩm
      const dSl = Number(r.rev) || 0;
      const dDt = dSl * price;
      const dDtUpd = updQty * price;
      const dQuota = (Number(r.qOld) || 0) + (Number(r.qMain) || 0) + (Number(r.qAdd) || 0);
      const dYtd = inYtd ? actQty : 0;
      const dDtYtd = inYtd ? actQty * price : 0;
      const dKhLeft = inYtd ? 0 : updQty; // KH còn lại YTD = KH update các tháng SAU tháng hiện tại
      const dMoKh = planUpd * price;       // DThu KH update của tháng này
      const dMoAct = actQty * price;       // DThu thực hiện của tháng này
      const dKhYtdDt = inYtd ? dMoKh : 0;  // DThu KH update luỹ kế YTD
      const bump = o => {
        o.dt += dDt;
        o.dtUpd += dDtUpd;
        o.quotaFY += dQuota;
        o.ytd += dYtd;
        o.khLeft += dKhLeft;
        o.dtYtd += dDtYtd;
        if (mi >= 0) { o.moKhDt[mi] += dMoKh; o.moActDt[mi] += dMoAct; }
        o.khYtdDt += dKhYtdDt;
      };
      const prodKey = `${r.grp}||${r.mset}||${r.prod}`;
      bump(c);
      c.prods.add(prodKey);
      // --- Cấp Khách hàng thật (chỉ dưới nhóm "Ngoài kế hoạch") ---
      // Nhóm SP / Sản phẩm treo dưới KH thật, không treo thẳng vào nhóm "Ngoài kế hoạch".

    return customers.filter(c => {
      const hay = norm((c.cust || '') + ' ' + (c.custId || ''));
      return toks.every(t => hay.includes(t)); // khớp gần đúng: mọi từ khoá đều xuất hiện

    return () => document.removeEventListener('mousedown', onDoc);

  const pick = c => { onChange(c.custId || c.cust); setOpen(false); setQ(''); };

    h("input", {

// Chỉ số danh mục sản phẩm — dựng MỘT LẦN ở App rồi truyền xuống mọi thẻ KH.
// Nếu để từng thẻ tự filter cả danh mục thì mở 100 KH = hàng trăm nghìn
// phép lọc mỗi lần render. Ở đây chỉ còn tra Map.
function buildCatalogIndex(catalog) {
  const byGrp = new Map();
  for (const c of catalog || []) {
    const g = c.grp || '';
    if (!g) continue;
    let node = byGrp.get(g);
    if (!node) { node = { msets: new Map(), noMset: [] }; byGrp.set(g, node); }
    const m = c.mset || '';
    if (!m) { node.noMset.push(c); continue; }
    let arr = node.msets.get(m);
    if (!arr) { arr = []; node.msets.set(m, arr); }
    arr.push(c);
  }
  const sorted = new Map(); // cache danh sách bộ vật tư đã sort theo nhóm
  return {
    groups: Array.from(byGrp.keys()).sort(),
    // Nhóm "lai" (vừa có dòng có bộ vật tư, vừa có dòng bo_vat_tu rỗng) được thêm
    // một mục NO_MSET ở cuối — nếu không thì các SP rỗng bộ vật tư không cách nào chọn.
    msetsOf(g) {
      const n = byGrp.get(g);
      if (!n) return [];
      if (!sorted.has(g)) {
        const list = Array.from(n.msets.keys()).sort();
        if (list.length && n.noMset.length) list.push(NO_MSET);
        sorted.set(g, list);
      }
      return sorted.get(g);
    },
    // Nhóm không có bộ vật tư → trả thẳng sản phẩm của nhóm; ngược lại phải chọn bộ vật tư.
    prodsOf(g, m) {
      const n = byGrp.get(g);
      if (!n) return [];
      if (n.msets.size === 0) return n.noMset;
      if (m === NO_MSET) return n.noMset;
      return m ? (n.msets.get(m) || []) : [];
    }
  };
}

        items.length === 0
          ? h("div", { className: "px-3 py-6 text-center text-[12.5px] text-slate-400" },
              !grp ? "Chọn nhóm sản phẩm để bắt đầu" : "Bộ này chưa có vật tư trong danh mục")
          : items.map(name => {
              const dup = isDup(name);
              const on = sel.has(name);
              const goiY = priceOf ? priceOf(grp, msetVal, name) : null;
              return h("div", {
                key: name,
                className: "flex items-center gap-2 px-3 py-1.5 " + (dup ? "bg-slate-50" : on ? "bg-emerald-50/40" : "")
              },
                h("input", {
                  type: "checkbox", checked: on, disabled: dup || busy,
                  onChange: () => toggle(name),
                  className: "accent-emerald-600 flex-shrink-0"
                }),
                h("span", {
                  className: "flex-1 min-w-0 truncate text-[12.5px] " + (dup ? "text-slate-400" : "text-slate-700"),
                  title: name
                }, name),
                dup
                  ? h("span", { className: "text-[11px] text-amber-600 flex-shrink-0" }, "đã có trong kế hoạch")
                  : h(React.Fragment, null,
                      h("input", {
                        value: on ? (sel.get(name) || '') : fmtTr(goiY),
                        onChange: e => setPrice(name, e.target.value),
                        disabled: !on || busy,
                        inputMode: "decimal",
                        placeholder: goiY ? "" : "nhập giá",
                        title: goiY ? "Giá đang dùng cho vật tư này trong kế hoạch"
                                    : "Vật tư này chưa có đơn giá trong kế hoạch — nhập tay",
                        className: "w-24 px-2 py-1 text-[12.5px] text-right border rounded-md outline-none focus:border-emerald-500 " +
                          (on && parseTr(sel.get(name)) == null ? "border-amber-400 bg-amber-50"
                            : on && goiY ? "border-slate-200 bg-emerald-50/60" : "border-slate-200")
                      }),
                      h("span", { className: "text-[11px] text-slate-400 w-11 flex-shrink-0" }, "tr.VND")));
            }))),
    // --- Chân form ---
    h("div", { className: "flex items-center gap-3 flex-wrap" },
      sel.size > 0 && h("span", { className: "text-[12px] text-slate-600" },
        "Đã chọn ", h("span", { className: "font-semibold text-slate-800" }, sel.size), " sản phẩm · ",
        sel.size * 12, " dòng (T4→T3), SL = 0"),
      thieuGia.length > 0 && h("span", { className: "text-[12px] text-amber-600" },
        "Còn ", thieuGia.length, " dòng chưa có đơn giá"),
      err && h("span", { className: "text-[12px] text-red-600" }, err),
      msg && h("span", { className: "text-[12px] text-emerald-600" }, msg),
      h("div", { className: "flex-1" }),
      h("button", {
        onClick: confirm,
        disabled: !ready,
        className: "flex items-center gap-1.5 px-4 py-1.5 text-[13px] font-semibold bg-emerald-600 hover:bg-emerald-700 text-white rounded-md disabled:opacity-50"
      }, busy
        ? h(React.Fragment, null, h(Loader2, { size: 14, className: "animate-spin" }), ` Đang thêm ${done}/${sel.size}…`)
        : h(React.Fragment, null, h(Plus, { size: 14 }), sel.size > 1 ? ` Thêm ${sel.size} sản phẩm` : " Thêm sản phẩm"))));
}

// Panel "Thêm khách hàng": chọn KH + PS + miền. Chưa ghi DB (schema không có bảng
// riêng cho KH của kế hoạch — KH chỉ tồn tại khi có dòng sản phẩm), chỉ tạo 1 thẻ KH
// tạm ở đầu danh sách để người dùng thêm sản phẩm ngay tại đó.
// Popup "Thêm khách hàng" — mở từ nút trên thanh bộ lọc (màn chi tiết).
// KH mới CHƯA vào DB: bấm Xác nhận chỉ tạo thẻ KH tạm ở client, phải thêm sản
// phẩm đầu tiên thì mới thực sự ghi (xem NewCustomerCard).
// KHÔNG có ô Miền: miền là thuộc tính của PS, suy từ PS đã chọn (PS nào có nhiều
// miền thì rơi về miền đã khai báo trong địa bàn); client không suy được thì để
// trống, server tự điền bằng mienForPs().
function AddCustomerModal({ open, onClose, customers, psOptions, regionsByPs, diaBanByCust, existingCustKeys, catIdx, groupsByPs, priceOf, onAdd, onAddProduct }) {
  const h = React.createElement;
  const [custKey, setCustKey] = useState('');
  const [ps, setPs] = useState(psOptions && psOptions.length === 1 ? psOptions[0] : '');
  const [step, setStep] = useState(1);   // 1 = chọn KH/PS, 2 = thêm sản phẩm đầu tiên
  const [added, setAdded] = useState(0); // số SP đã thêm trong lần mở này
  // Mỗi lần mở lại là một lần thêm mới → xoá lựa chọn cũ
  useEffect(() => {
    if (open) {
      setCustKey('');
      setPs(psOptions && psOptions.length === 1 ? psOptions[0] : '');
      setStep(1);
      setAdded(0);
    }
  }, [open]);
  const cust = useMemo(() => customers.find(c => (c.custId || c.cust) === custKey), [customers, custKey]);
  // Địa bàn đã khai báo cho KH này (dm_dia_ban) — nguồn chuẩn cho PS/Miền.
  const terr = useMemo(
    () => (cust && diaBanByCust && diaBanByCust.get(dbCustKey(cust.custId, cust.cust))) || null,
    [diaBanByCust, cust]
  );
  // Chọn KH → tự điền PS nếu địa bàn chỉ khai báo đúng 1 PS cho KH đó.
  useEffect(() => {
    if (terr && terr.ps.length === 1) setPs(terr.ps[0]);
  }, [terr]);
  const psRegions = useMemo(() => (ps && regionsByPs.get(ps)) || [], [regionsByPs, ps]);
  const region = psRegions.length === 1 ? psRegions[0]
    : (terr && terr.mien.length === 1 ? terr.mien[0] : '');
  const already = !!(cust && existingCustKeys.has(fmtCust(cust.cust)));
  const lbl = "block text-[10.5px] uppercase tracking-wide text-slate-500 font-medium mb-1";
  const sel = "w-full px-2.5 py-2 text-[13px] border border-slate-200 rounded-md bg-white outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 disabled:bg-slate-50";
  const ready = !!cust && !!ps && !already;
  // Bỏ qua bước sản phẩm → chỉ tạo thẻ KH tạm ở client (chưa ghi DB)
  const chiThemKH = () => {
    if (!ready) return;
    onAdd({ custId: cust.custId || '', cust: cust.cust, ps, region });
    onClose();
  };
  const themSanPham = async (sp) => {
    const ok = await onAddProduct({ ...sp, custId: cust.custId || '', cust: cust.cust, region });
    if (ok) setAdded(n => n + 1);
    return ok;
  };
  const coDanhMuc = !!(catIdx && groupsByPs);
  return h(Modal, {
    open, onClose,
    title: step === 1 ? "Thêm khách hàng" : `Sản phẩm đầu tiên · ${cust ? fmtCust(cust.cust) : ''}`,
    icon: h(UserPlus, { size: 16, className: "text-emerald-600" }),
    width: step === 1 ? 520 : 760,
    footer: step === 1
      ? h("div", { className: "flex items-center gap-2 px-4 py-3 border-t border-slate-100" },
          h("div", { className: "flex-1" }),
          h("button", {
            onClick: onClose,
            className: "px-3 py-1.5 text-[13px] text-slate-600 hover:bg-slate-100 rounded-md"
          }, "Hủy"),
          // Vẫn giữ đường cũ: tạo thẻ KH rồi thêm sản phẩm sau, cho ai chưa chọn được SP ngay
          coDanhMuc && h("button", {
            onClick: chiThemKH,
            disabled: !ready,
            className: "px-3 py-1.5 text-[13px] text-slate-600 border border-slate-200 rounded-md hover:bg-slate-100 disabled:opacity-50"
          }, "Chỉ thêm KH"),
          h("button", {
            onClick: () => (coDanhMuc ? setStep(2) : chiThemKH()),
            disabled: !ready,
            className: "flex items-center gap-1.5 px-4 py-1.5 text-[13px] font-semibold bg-emerald-600 hover:bg-emerald-700 text-white rounded-md disabled:opacity-50"
          }, coDanhMuc ? "Xác nhận & thêm SP" : h(React.Fragment, null, h(Plus, { size: 14 }), "Xác nhận")))
      : h("div", { className: "flex items-center gap-2 px-4 py-3 border-t border-slate-100" },
          added > 0
            ? h("span", { className: "text-[12px] text-emerald-600" }, "Đã thêm ", added, " sản phẩm — khách hàng đã vào kế hoạch")
            : h("span", { className: "text-[12px] text-slate-400" }, "Chưa thêm sản phẩm nào thì khách hàng chưa vào kế hoạch"),
          h("div", { className: "flex-1" }),
          h("button", {
            onClick: () => setStep(1),
            className: "px-3 py-1.5 text-[13px] text-slate-600 hover:bg-slate-100 rounded-md"
          }, "Quay lại"),
          h("button", {
            onClick: () => { if (added === 0) chiThemKH(); else onClose(); },
            className: "px-4 py-1.5 text-[13px] font-semibold text-emerald-700 border border-emerald-200 rounded-md hover:bg-emerald-50"
          }, added > 0 ? "Xong" : "Bỏ qua, thêm SP sau"))
  },
    step === 1
      ? h("div", { className: "px-4 py-3 space-y-3" },
          h("div", null, h("label", { className: lbl }, "Khách hàng"),
            h(CustomerPicker, { customers, value: custKey, onChange: setCustKey, className: sel })),
          h("div", null,
            h("label", { className: lbl }, "PS phụ trách",
              terr && terr.ps.length === 1 && h("span", { className: "text-slate-400 normal-case tracking-normal" }, " · theo địa bàn")),
            h("select", { value: ps, onChange: e => setPs(e.target.value), disabled: !cust, className: sel },
              h("option", { value: "" }, "— Chọn PS —"),
              // PS đã khai báo địa bàn cho KH này lên đầu; vẫn cho chọn PS khác vì
              // địa bàn có thể chưa khai báo kịp (màn "Cấu hình địa bàn" để bù).
              terr && terr.ps.length > 0 && h("optgroup", { label: "Theo địa bàn đã khai báo" },
                terr.ps.map(p => h("option", { key: 'd:' + p, value: p }, p))),
              h("optgroup", { label: "Tất cả PS" },
                (psOptions || []).map(p => h("option", { key: p, value: p }, p)))),
            ps && h("p", { className: "text-[11px] text-slate-400 mt-1" },
              region ? `Miền: ${region} (theo PS)` : 'Miền suy theo PS khi lưu')),
          already && h("p", { className: "text-[12px] text-amber-600" },
            "Khách hàng này đã có trong kế hoạch — dùng nút “Thêm SP” ở thẻ của họ."))
      // Bước 2 dùng lại đúng form thêm SP của thẻ KH: thêm được liên tiếp nhiều SP,
      // mỗi lần bấm "Thêm sản phẩm" là ghi thật xuống DB.
      : h(ProductPickerForm, {
          catIdx, groupsByPs, psOptions: [ps], existing: null, priceOf,
          onSubmit: themSanPham
        }));
}

// Thẻ KH vừa thêm nhưng CHƯA có sản phẩm nào → chưa có dòng nào trong DB.
// Chỉ tồn tại ở client cho tới khi thêm sản phẩm đầu tiên (lúc đó KH xuất hiện
// trong danh sách thật và thẻ tạm này tự biến mất).
function NewCustomerCard({ cust, catIdx, groupsByPs, priceOf, onAddProduct, onDismiss }) {
  const h = React.createElement;
  return h("div", { className: "bg-white rounded-lg border-2 border-dashed border-emerald-300 mb-3 overflow-hidden" },
    h("div", { className: "flex items-stretch" },
      h("div", { className: "bg-emerald-600 text-white px-3 py-3 flex items-center justify-center min-w-[88px]" },
        h("div", { className: "text-[11px] opacity-90 font-mono" }, cust.custId || '—')),
      h("div", { className: "flex-1 flex items-center gap-3 px-4 py-3 min-w-0" },
        h("div", { className: "flex-1 min-w-0" },
          h("h3", { className: "text-[14px] font-semibold text-slate-900 truncate" }, fmtCust(cust.cust)),
          h("p", { className: "text-[11px] text-slate-500 mt-0.5" },
            "KH mới · PS ", cust.ps, " · ", cust.region,
            h("span", { className: "text-amber-600" }, " · chưa lưu — thêm sản phẩm đầu tiên để lưu vào kế hoạch"))),
        h("button", {
          onClick: onDismiss,

          className: "p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-md"
        }, h(XIcon, { size: 15 })))),
    h(ProductPickerForm, {
      catIdx,
      groupsByPs,

      onSubmit: s => onAddProduct({ ...s, custId: cust.custId, cust: cust.cust, region: cust.region })
    }));

// ============ CẤU HÌNH ĐỊA BÀN (Khách hàng × Ngành hàng → PS, có thời gian hiệu lực) ============
// dm_dia_ban khai báo ai phụ trách ngành hàng nào của khách hàng nào, VÀ TỪ THÁNG
// NÀO ĐẾN THÁNG NÀO. Đổi người phụ trách giữa năm KHÔNG sửa bản cũ mà "Chuyển PS":
// đóng bản cũ ở tháng liền trước + mở bản mới → tháng cũ vĩnh viễn thuộc PS cũ, dù
// sau đó cấu hình đổi bao nhiêu lần.
//
// Kế hoạch KHÔNG tự đổi theo khai báo: phải bấm "Áp dụng", và mỗi bản chỉ ghi vào
// các tháng nó phủ nên bản mới không bao giờ ghi đè tháng đã qua (khoá khớp actual
// tháng|PS|maKH|bộVT|SP của quá khứ được giữ nguyên).
//
// Ràng buộc: tổ hợp (KH × ngành hàng) ĐÃ khai báo thì MỌI tháng đang có dòng kế
// hoạch phải được một bản nào đó phủ. Thiếu tháng = "khoảng trống" → backend chặn
// lưu; màn hình cảnh báo ngay tại chỗ để không phải thử rồi mới biết.
const MAX_DIA_BAN_ROWS = 500; // bảng phẳng (không gập nhóm như màn chi tiết) → phải có trần
const MO_ALL = 'all';         // giá trị ô "Xem theo tháng" = xem cả lịch sử

// Khoá đối chiếu khách hàng giữa dm_dia_ban và sale_target: ưu tiên mã KH, rỗng
// thì rơi về tên GỐC trong DB (cust đã fmtCust không dùng được để so khớp).
// Phải khớp đúng cột sinh cust_key của dm_dia_ban.
const dbCustKey = (custId, cust) => String(custId || '').trim() || String(cust || '').trim();
// '2026-07' -> 'T7/26'
const fmtMo = mo => {
  if (!mo) return '';
  const p = String(mo).split('-');
  return p.length < 2 ? String(mo) : 'T' + Number(p[1]) + '/' + p[0].slice(2);
};
const fmtHieuLuc = (tu, den) => (tu ? fmtMo(tu) : fmtMo(MONTHS[0])) + ' → ' + (den ? fmtMo(den) : 'nay');
// Bản khai báo có phủ tháng mo không (tu rỗng = từ đầu năm, den rỗng = còn hiệu lực)
const phuThang = (v, mo) => (!v.tuThang || v.tuThang <= mo) && (!v.denThang || v.denThang >= mo);
// Tháng đang có kế hoạch mà không bản nào phủ. versions rỗng = chưa khai báo gì →
// KHÔNG tính là khoảng trống (đó là mục "chưa khai báo", backend cũng bỏ qua).
const khoangTrong = (planMonths, versions) => {
  if (!planMonths || planMonths.size === 0 || !versions || versions.length === 0) return [];
  return MONTHS.filter(mo => planMonths.has(mo) && !versions.some(v => phuThang(v, mo)));
};

// Dịch lỗi backend địa bàn sang câu cho người cấu hình. Loại có CHI TIẾT (thiếu
// tháng nào, tháng nào không hợp lệ) được backend trả nguyên văn kèm dữ liệu cụ thể
// → chỉ bỏ tiền tố mã lỗi, giữ nguyên phần nội dung.
const diaBanErrMsg = m => {
  const s = String(m || '');
  if (s === 'dup_dia_ban') return 'địa bàn này đã được khai báo cho PS đó từ cùng một tháng.';
  if (s === 'forbidden') return 'chỉ admin được sửa cấu hình địa bàn.';
  if (s === 'forbidden_rows') return 'có dòng ngoài phạm vi quyền của bạn.';
  if (s === 'thieu_du_lieu') return 'thiếu khách hàng / ngành hàng / PS.';
  if (s === 'khong_ton_tai') return 'bản khai báo này không còn tồn tại — hãy tải lại.';
  if (s.startsWith('khoang_trong:')) {
    return 'sẽ có tháng không ai phụ trách — ' + s.slice('khoang_trong:'.length).trim();
  }
  const i = s.indexOf(':');
  if (i > 0 && /^[a-z_]+$/.test(s.slice(0, i))) return s.slice(i + 1).trim();
  return s;
};

// mienByPs: PS -> Miền (suy từ dữ liệu kế hoạch, chỉ khi PS đó thuộc đúng 1 miền).
// Miền KHÔNG phải trường nhập tay: nó là thuộc tính của PS, chọn tay chỉ tạo cơ hội
// gán lệch miền cho cùng một PS. Backend cũng tự suy lại khi lưu, không tin client.
function DiaBanView({
  rows, diaBan, customers, psOptions, mienByPs, psKnown, groupOptions, canEdit,
  psFilter, regionFilter, groupFilter, custFilter, onSave, onDelete, onApply, onMove, busy
}) {
  const h = React.createElement;
  // PS lạ = có trong kế hoạch/khai báo nhưng KHÔNG có trong danh mục dm_ps.
  // psKnown rỗng (chưa tải được danh mục) → không kiểm tra, tránh báo động nhầm.
  const psLa = ps => psKnown && psKnown.size > 0 && !psKnown.has(String(ps || '').trim().toLowerCase());
  const [edits, setEdits] = useState({}); // { id: ps } — PS đã đổi, chưa lưu
  const [search, setSearch] = useState('');
  const [viewMo, setViewMo] = useState(CURRENT_MONTH); // tháng đang xem (MO_ALL = cả lịch sử)
  const [showMissing, setShowMissing] = useState(false);
  const [closed, setClosed] = useState(() => new Set()); // KH đang gập
  const [move, setMove] = useState(null); // { id, ps, tuThang } — form "Chuyển PS"
  const [nRow, setNRow] = useState({ custKey: '', grp: '', ps: '', tuThang: MONTHS[0] });

  // (Khách hàng × ngành hàng) -> PS đang THẬT SỰ có dòng kế hoạch, TÁCH THEO THÁNG
  // (khai báo có khoảng hiệu lực nên đối chiếu cũng phải theo tháng).
  const planIdx = useMemo(() => {
    const m = new Map();
    rows.forEach(r => {
      if (!r.grp || !r.ps || !r.mo) return;
      const k = dbCustKey(r.custId, r.custRaw || r.cust);
      if (!k) return;
      const mk = k + '||' + r.grp;
      let e = m.get(mk);
      if (!e) {
        e = { custId: r.custId || '', cust: r.custRaw || r.cust, grp: r.grp, mien: r.region || '',
              psByMonth: new Map(), months: new Set() };
        m.set(mk, e);
      }
      e.months.add(r.mo);
      let s = e.psByMonth.get(r.mo);
      if (!s) { s = new Set(); e.psByMonth.set(r.mo, s); }
      s.add(r.ps);
    });
    return m;
  }, [rows]);

  // Mọi bản khai báo của một tổ hợp (KHÔNG lọc theo tháng đang xem) — dùng để tính
  // khoảng trống và để biết tổ hợp đã khai báo hay chưa.
  const cfgByPair = useMemo(() => {
    const m = new Map();
    diaBan.forEach(d => {
      const k = dbCustKey(d.custId, d.cust) + '||' + d.grp;
      let a = m.get(k);
      if (!a) { a = []; m.set(k, a); }
      a.push(d);
    });
    return m;
  }, [diaBan]);

  // Có kế hoạch nhưng CHƯA khai báo địa bàn. Suy khai báo theo TỪNG KHOẢNG THÁNG
  // LIÊN TIẾP của mỗi PS trong kế hoạch → khai báo lại đúng lịch sử, không tạo
  // khoảng trống và không tạo chồng lấn vô cớ.
  const missing = useMemo(() => {
    const out = [];
    planIdx.forEach((e, pairKey) => {
      if (cfgByPair.has(pairKey)) return;
      const psMonths = new Map();
      MONTHS.forEach(mo => {
        const s = e.psByMonth.get(mo);
        if (s) s.forEach(p => {
          if (!psMonths.has(p)) psMonths.set(p, []);
          psMonths.get(p).push(mo);
        });
      });
      psMonths.forEach((mos, ps) => {
        let start = null, prev = null;
        const flush = () => {
          if (start == null) return;
          out.push({
            custId: e.custId, cust: e.cust, grp: e.grp, ps, tuThang: start,
            denThang: prev === MONTHS[MONTHS.length - 1] ? '' : prev // tới hết năm → để mở
          });
          start = null;
        };
        mos.forEach(mo => {
          if (start == null || MONTHS.indexOf(mo) !== MONTHS.indexOf(prev) + 1) { flush(); start = mo; }
          prev = mo;
        });
        flush();
      });
    });
    return out.sort((a, b) => (a.cust || '').localeCompare(b.cust || '') ||
                              a.grp.localeCompare(b.grp) || a.tuThang.localeCompare(b.tuThang));
  }, [planIdx, cfgByPair]);

  // Danh sách hiển thị: chỉ các bản hiệu lực trong tháng đang xem (hoặc tất cả),
  // qua bộ lọc chung + ô tìm kiếm, kèm trạng thái đối chiếu kế hoạch TRONG KHOẢNG
  // HIỆU LỰC của chính bản đó.
  const list = useMemo(() => {
    const q = deaccent(search.trim());
    const out = [];
    for (const d of diaBan) {
      if (viewMo !== MO_ALL && !phuThang(d, viewMo)) continue;
      const ps = edits[d.id] || d.ps;
      // Miền luôn suy theo PS; giá trị lưu trong DB chỉ dùng khi PS đó chưa xác định
      // được miền (chưa có dòng kế hoạch, hoặc đang có mặt ở nhiều miền).
      const mien = mienByPs.get(ps) || d.mien || '';
      if (!inSel(regionFilter, mien)) continue;
      if (!inSel(psFilter, ps)) continue;
      if (!inSel(groupFilter, d.grp)) continue;
      if (!inSel(custFilter, fmtCust(d.cust))) continue;
      if (q && !(deaccent(d.cust).includes(q) || deaccent(d.custId).includes(q) ||
                 deaccent(ps).includes(q) || deaccent(d.grp).includes(q))) continue;
      const plan = planIdx.get(dbCustKey(d.custId, d.cust) + '||' + d.grp);
      let status = 'noplan', planPs = [];
      if (plan) {
        const inWindow = new Set();
        MONTHS.forEach(mo => {
          if (!phuThang(d, mo)) return;
          const s = plan.psByMonth.get(mo);
          if (s) s.forEach(p => inWindow.add(p));
        });
        if (inWindow.size === 0) status = 'noplan';
        else if (inWindow.size === 1 && inWindow.has(ps)) status = 'ok';
        else {
          status = 'diff';
          planPs = Array.from(inWindow).filter(p => p !== ps);
          if (!planPs.length) planPs = Array.from(inWindow);
        }
      }
      out.push({ ...d, ps, mien, status, planPs });
    }
    return out;
  }, [diaBan, edits, mienByPs, planIdx, viewMo, search, psFilter, regionFilter, groupFilter, custFilter]);

  // Gom theo KHÁCH HÀNG: 1 KH thường có nhiều ngành hàng (và có thể khác PS mỗi
  // ngành) → xem theo nhóm dễ soát hơn bảng phẳng lặp tên KH ở mọi dòng.
  const groups = useMemo(() => {
    const m = new Map();
    for (const d of list) {
      const k = dbCustKey(d.custId, d.cust);
      let g = m.get(k);
      if (!g) { g = { key: k, custId: d.custId, cust: d.cust, rows: [], diff: 0, gaps: [] }; m.set(k, g); }
      g.rows.push(d);
      if (d.status === 'diff') g.diff++;
    }
    const arr = Array.from(m.values());
    arr.forEach(g => {
      g.rows.sort((a, b) => a.grp.localeCompare(b.grp) ||
                            (a.tuThang || '').localeCompare(b.tuThang || '') ||
                            a.ps.localeCompare(b.ps));
      // Khoảng trống tính trên TOÀN BỘ bản khai báo của tổ hợp, không phụ thuộc
      // tháng đang xem — cảnh báo phải hiện dù đang xem tháng khác.
      const seen = new Set();
      g.rows.forEach(d => {
        if (seen.has(d.grp)) return;
        seen.add(d.grp);
        const pairKey = g.key + '||' + d.grp;
        const plan = planIdx.get(pairKey);
        const thieu = khoangTrong(plan && plan.months, cfgByPair.get(pairKey));
        if (thieu.length) g.gaps.push({ grp: d.grp, thieu });
      });
    });
    arr.sort((a, b) => fmtCust(a.cust).localeCompare(fmtCust(b.cust)));
    return arr;
  }, [list, planIdx, cfgByPair]);

  // Trần hiển thị tính theo dòng nhưng CẮT Ở RANH GIỚI KHÁCH HÀNG (không hiện nửa KH).
  const shownGroups = useMemo(() => {
    const out = [];
    let n = 0;
    for (const g of groups) {
      if (n >= MAX_DIA_BAN_ROWS) break;
      out.push(g);
      n += g.rows.length;
    }
    return out;
  }, [groups]);
  const shownRows = shownGroups.reduce((s, g) => s + g.rows.length, 0);
  const allClosed = closed.size >= shownGroups.length && shownGroups.length > 0;

  // Khoảng trống trên TOÀN BỘ cấu hình — không phụ thuộc tháng đang xem hay bộ lọc.
  // Đây là lỗi chặn lưu nên phải luôn thấy: tổ hợp có khoảng trống thường lại là tổ
  // hợp mà bản khai báo KHÔNG hiệu lực trong tháng đang xem (nên không có dòng nào
  // trên bảng để gắn badge).
  const allGaps = useMemo(() => {
    const out = [];
    cfgByPair.forEach((vers, pairKey) => {
      const plan = planIdx.get(pairKey);
      const thieu = khoangTrong(plan && plan.months, vers);
      if (!thieu.length) return;
      out.push({ custId: vers[0].custId, cust: vers[0].cust, grp: vers[0].grp, thieu });
    });
    return out.sort((a, b) => fmtCust(a.cust || '').localeCompare(fmtCust(b.cust || '')));
  }, [cfgByPair, planIdx]);

  // Dòng lệch ĐANG ÁP DỤNG ĐƯỢC: bỏ dòng còn sửa dở, vì "Áp dụng" ghi theo giá trị
  // ĐÃ LƯU trong dm_dia_ban — áp dụng dòng đang sửa sẽ đẩy xuống PS cũ, không phải
  // PS vừa chọn trên màn hình.
  const diffIds = useMemo(
    () => list.filter(r => r.status === 'diff' && !edits[r.id]).map(r => r.id),
    [list, edits]
  );
  const editCount = Object.keys(edits).length;
  const custCount = groups.length;
  const psLaList = useMemo(
    () => Array.from(new Set(list.filter(d => psLa(d.ps)).map(d => d.ps))).sort(),
    [list, psKnown]
  );

  // Chỉ PS là sửa được tại chỗ (sửa sai cho CẢ khoảng hiệu lực của bản đó); đổi
  // người phụ trách giữa năm phải dùng "Chuyển PS". Miền đi theo PS.
  const setEdit = (d, ps) => setEdits(prev => {
    if (ps === d.ps) { // về đúng giá trị gốc → bỏ khỏi danh sách chưa lưu
      const o = { ...prev };
      delete o[d.id];
      return o;
    }
    return { ...prev, [d.id]: ps };
  });
  const toggleGroup = key => setClosed(prev => {
    const next = new Set(prev);
    if (next.has(key)) next.delete(key); else next.add(key);
    return next;
  });

  const byId = useMemo(() => new Map(diaBan.map(d => [d.id, d])), [diaBan]);
  const saveEdits = async () => {
    // KHÔNG gửi mien (backend suy theo PS) và KHÔNG gửi khoảng hiệu lực (giữ nguyên).
    const payload = Object.entries(edits).map(([id, ps]) => {
      const base = byId.get(Number(id)) || {};
      return { id: Number(id), custId: base.custId, cust: base.cust, grp: base.grp, ps };
    }).filter(r => r.ps && r.grp);
    if (!payload.length) return;
    if (await onSave(payload)) setEdits({});
  };

  const newCust = useMemo(
    () => customers.find(c => (c.custId || c.cust) === nRow.custKey),
    [customers, nRow.custKey]
  );
  const newMien = (nRow.ps && mienByPs.get(nRow.ps)) || '';
  // Cảnh báo TRƯỚC khi lưu: thêm bản bắt đầu từ giữa năm cho tổ hợp đang có kế
  // hoạch ở các tháng trước đó = khoảng trống → backend sẽ chặn.
  const newGaps = useMemo(() => {
    if (!newCust || !nRow.grp) return [];
    const pairKey = dbCustKey(newCust.custId, newCust.cust) + '||' + nRow.grp;
    const plan = planIdx.get(pairKey);
    if (!plan) return [];
    return khoangTrong(plan.months,
      (cfgByPair.get(pairKey) || []).concat([{ tuThang: nRow.tuThang, denThang: '' }]));
  }, [newCust, nRow.grp, nRow.tuThang, planIdx, cfgByPair]);
  const addRow = async () => {
    if (!newCust || !nRow.grp || !nRow.ps || newGaps.length) return;
    const ok = await onSave([{
      custId: newCust.custId || '', cust: newCust.cust, grp: nRow.grp, ps: nRow.ps,
      tuThang: nRow.tuThang
    }]);
    if (ok) setNRow({ custKey: '', grp: '', ps: '', tuThang: MONTHS[0] });
  };

  const declareMissing = async () => {
    // Khai báo đúng những gì kế hoạch đang có (kể cả khoảng thời gian) → không sinh
    // thay đổi nào cho sale_target và không sinh khoảng trống.
    const batch = missing.slice(0, MAX_DIA_BAN_ROWS).map(m => ({
      custId: m.custId, cust: m.cust, grp: m.grp, ps: m.ps,
      tuThang: m.tuThang, denThang: m.denThang
    }));
    if (!batch.length) return;
    if (!confirm(`Khai báo ${batch.length} địa bàn theo đúng PS & khoảng thời gian đang có trong kế hoạch?`)) return;
    await onSave(batch);
  };

  const applyIds = async (ids) => {
    if (!ids.length) return;
    const vers = ids.map(id => byId.get(id)).filter(Boolean);
    const coQuaKhu = vers.some(v => (v.tuThang || MONTHS[0]) < CURRENT_MONTH);
    const win = vers.length === 1 ? ` (${fmtHieuLuc(vers[0].tuThang, vers[0].denThang)})` : '';
    if (!confirm(`Ghi PS/Miền đã khai báo xuống ${ids.length} địa bàn${win}, ` +
      `theo đúng khoảng hiệu lực của từng bản?\n\n` +
      `Các tháng ngoài khoảng hiệu lực không bị đụng tới.` +
      (coQuaKhu ? `\n\nLưu ý: có bản phủ tháng đã qua — số thực hiện đã import của các tháng đó sẽ khớp lại theo PS của bản này.` : ''))) return;
    await onApply(ids);
  };

  const doMove = async () => {
    if (!move || !move.ps || !move.tuThang) return;
    if (await onMove({ id: move.id, ps: move.ps, tuThang: move.tuThang })) setMove(null);
  };
  const doDelete = d => {
    const pairKey = dbCustKey(d.custId, d.cust) + '||' + d.grp;
    const plan = planIdx.get(pairKey);
    const conLai = (cfgByPair.get(pairKey) || []).filter(v => v.id !== d.id);
    const thieu = khoangTrong(plan && plan.months, conLai);
    if (thieu.length) {
      alert(`Không xóa được bản khai báo này: các tháng ${thieu.map(fmtMo).join(', ')} ` +
        `của ${fmtCust(d.cust)} / ${d.grp} đang có kế hoạch nhưng sẽ không còn ai phụ trách.\n\n` +
        `Hãy khai báo PS cho các tháng đó trước (hoặc xóa toàn bộ khai báo của tổ hợp này).`);
      return;
    }
    if (confirm(`Xóa khai báo địa bàn "${d.grp}" của ${fmtCust(d.cust)} — PS ${d.ps}, ` +
      `${fmtHieuLuc(d.tuThang, d.denThang)}?\n\nCác dòng kế hoạch đã có KHÔNG bị xóa.`)) onDelete([d.id]);
  };

  const lbl = "block text-[10.5px] uppercase tracking-wide text-slate-500 font-medium mb-1";
  const sel = "w-full px-2.5 py-2 text-[13px] border border-slate-200 rounded-md bg-white outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 disabled:bg-slate-50";
  const cellSel = "w-full px-1.5 py-1 text-[12px] border rounded bg-white outline-none focus:border-emerald-500";
  const th = "px-2 py-2 text-[10.5px] uppercase tracking-wide text-slate-500 font-semibold whitespace-nowrap";
  const td = "px-2 py-1.5 text-[12px] border-t border-slate-100";
  const BADGE = {
    ok: ['bg-emerald-50 text-emerald-700', 'Khớp kế hoạch'],
    diff: ['bg-amber-50 text-amber-700', 'Lệch kế hoạch'],
    noplan: ['bg-slate-100 text-slate-500', 'Chưa có kế hoạch']
  };
  const COLS = canEdit ? 6 : 5; // Ngành hàng · Hiệu lực · Miền · PS · Đối chiếu (+ thao tác)

  return h("div", { className: "px-6 pb-8" },
    // ---- Thanh công cụ ----
    h("div", { className: "bg-white rounded-lg border border-slate-200 px-3 py-2.5 mb-3 flex items-center gap-2.5 flex-wrap" },
      h("span", { className: "text-[13px] font-semibold text-slate-700" }, "Cấu hình địa bàn"),
      h("span", { className: "text-[11px] text-slate-400" },
        fmtInt(list.length), " địa bàn · ", fmtInt(custCount), " khách hàng",
        diffIds.length > 0 && h("span", { className: "text-amber-600 font-medium" }, " · ", diffIds.length, " lệch kế hoạch"),
        allGaps.length > 0 && h("span", { className: "text-red-600 font-medium" }, " · ", allGaps.length, " tổ hợp thiếu tháng"),
        psLaList.length > 0 && h("span", {
          className: "text-red-600 font-medium",
          title: "PS đang được khai báo/dùng nhưng không có trong danh mục PS: " + psLaList.join(', ')
        }, " · ", psLaList.length, " PS ngoài danh mục"),
        missing.length > 0 && h("span", { className: "text-slate-500" }, " · ", missing.length, " chưa khai báo")),
      h("div", { className: "flex-1" }),
      h("label", { className: "flex items-center gap-1.5 text-[12px] text-slate-600" }, "Xem theo tháng",
        h("select", {
          value: viewMo,
          onChange: e => setViewMo(e.target.value),
          className: "px-2 py-1 text-[12px] border border-slate-200 rounded-md bg-white outline-none focus:border-emerald-500"
        }, MONTHS.map((mo, i) => h("option", { key: mo, value: mo }, MONTH_LABELS[i], mo === CURRENT_MONTH ? ' (hiện tại)' : '')),
          h("option", { value: MO_ALL }, "Tất cả (cả lịch sử)"))),
      shownGroups.length > 0 && h("button", {
        onClick: () => setClosed(allClosed ? new Set() : new Set(shownGroups.map(g => g.key))),
        className: "px-2.5 py-1.5 text-[13px] text-slate-600 hover:bg-slate-100 rounded-md"
      }, allClosed ? 'Mở tất cả' : 'Gập tất cả'),
      h("div", { className: "relative" },
        h(Search, { size: 14, className: "absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400" }),
        h("input", {
          value: search,
          onChange: e => setSearch(e.target.value),
          placeholder: "Tìm KH, mã KH, PS, ngành hàng…",
          className: "pl-8 pr-3 py-1.5 text-[13px] border border-slate-200 rounded-md w-64 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"
        })),
      canEdit && diffIds.length > 0 && h("button", {
        onClick: () => applyIds(diffIds),
        disabled: busy,
        className: "flex items-center gap-1.5 px-3 py-1.5 text-[13px] font-semibold bg-amber-500 hover:bg-amber-600 text-white rounded-md disabled:opacity-50"
      }, h(RefreshCw, { size: 14 }), " Áp dụng ", diffIds.length, " dòng lệch"),
      canEdit && editCount > 0 && h(React.Fragment, null,
        h("button", {
          onClick: () => setEdits({}),
          disabled: busy,
          className: "px-3 py-1.5 text-[13px] text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-md disabled:opacity-50"
        }, "Hủy"),
        h("button", {
          onClick: saveEdits,
          disabled: busy,
          className: "flex items-center gap-1.5 px-4 py-1.5 text-[13px] font-semibold bg-emerald-600 hover:bg-emerald-700 text-white rounded-md disabled:opacity-50"
        }, busy ? h(Loader2, { size: 14, className: "animate-spin" }) : h(Check, { size: 14 }),
          " Lưu khai báo (", editCount, ")"))),

    // ---- Cảnh báo khoảng trống: tháng có kế hoạch mà không ai phụ trách ----
    // Mọi thay đổi khác trên tổ hợp này sẽ bị backend chặn cho tới khi vá xong.
    allGaps.length > 0 && h("div", {
      className: "bg-red-50 border border-red-200 rounded-lg px-3 py-2.5 mb-3 text-[12px] text-red-800"
    }, h("div", { className: "flex items-center gap-2 flex-wrap" },
      h(AlertCircle, { size: 14, className: "shrink-0" }),
      h("span", { className: "font-semibold" }, allGaps.length, " tổ hợp có tháng không ai phụ trách"),
      h("span", { className: "text-red-600" },
        "— các tháng này đang có dòng kế hoạch; backend chặn mọi thay đổi khác của tổ hợp cho tới khi khai báo đủ."),
      h("div", { className: "flex-1" }),
      viewMo !== MO_ALL && h("button", {
        onClick: () => setViewMo(MO_ALL),
        className: "px-2 py-0.5 text-[11px] font-medium bg-red-100 hover:bg-red-200 rounded"
      }, "Xem tất cả bản khai báo")),
      h("div", { className: "mt-1.5 flex flex-col gap-0.5 max-h-32 overflow-auto scroll-shadow" },
        allGaps.slice(0, 20).map((g, i) => h("div", { key: i },
          h("span", { className: "font-mono text-red-500" }, g.custId || '—'), " ",
          h("span", { className: "font-medium" }, fmtCust(g.cust)), " / ", g.grp,
          ": thiếu ", h("span", { className: "font-semibold" }, g.thieu.map(fmtMo).join(', ')))),
        allGaps.length > 20 && h("div", { className: "text-red-600" }, "… và ", allGaps.length - 20, " tổ hợp nữa"))),

    // ---- Chưa khai báo (có kế hoạch nhưng thiếu trong danh mục) ----
    missing.length > 0 && h("div", { className: "bg-white rounded-lg border border-slate-200 mb-3" },
      h("div", { className: "flex items-center gap-2 px-3 py-2.5" },
        h("button", {
          onClick: () => setShowMissing(v => !v),
          className: "flex items-center gap-2 text-left"
        }, showMissing ? h(ChevronDown, { size: 15, className: "text-slate-500" })
          : h(ChevronRight, { size: 15, className: "text-slate-500" }),
          h("span", { className: "text-[13px] font-semibold text-slate-700" },
            "Có kế hoạch nhưng chưa khai báo địa bàn (", missing.length, ")")),
        h("div", { className: "flex-1" }),
        canEdit && h("button", {
          onClick: declareMissing,
          disabled: busy,
          className: "flex items-center gap-1.5 px-3 py-1.5 text-[13px] font-medium border border-emerald-200 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-md disabled:opacity-50"
        }, h(Plus, { size: 14 }), " Khai báo theo kế hoạch",
          missing.length > MAX_DIA_BAN_ROWS ? ` (${MAX_DIA_BAN_ROWS} dòng đầu)` : '')),
      showMissing && h("div", { className: "px-3 pb-3 max-h-64 overflow-auto scroll-shadow" },
        h("table", { className: "w-full" },
          h("tbody", null, missing.slice(0, MAX_DIA_BAN_ROWS).map((m, i) =>
            h("tr", { key: i },
              h("td", { className: td + " font-mono text-slate-400 whitespace-nowrap" }, m.custId || '—'),
              h("td", { className: td + " text-slate-700" }, fmtCust(m.cust)),
              h("td", { className: td + " text-slate-600" }, m.grp),
              h("td", { className: td + " text-slate-500 whitespace-nowrap" }, fmtHieuLuc(m.tuThang, m.denThang)),
              h("td", { className: td + " font-medium text-slate-800" }, m.ps))))))),

    // ---- Thêm địa bàn ----
    canEdit && h("div", { className: "bg-white rounded-lg border border-slate-200 mb-3 px-3 py-3" },
      h("div", { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-2.5" },
        h("div", { className: "lg:col-span-2" },
          h("label", { className: lbl }, "Khách hàng"),
          h(CustomerPicker, {
            customers,
            value: nRow.custKey,
            onChange: v => setNRow(s => ({ ...s, custKey: v })),
            className: sel
          })),
        h("div", null,
          h("label", { className: lbl }, "Ngành hàng"),
          h("select", {
            value: nRow.grp,
            onChange: e => setNRow(s => ({ ...s, grp: e.target.value })),
            disabled: !newCust,
            className: sel
          }, h("option", { value: "" }, "— Chọn ngành hàng —"),
            groupOptions.map(g => h("option", { key: g, value: g }, g)))),
        h("div", null,
          h("label", { className: lbl }, "PS phụ trách",

                    moving && h("tr", { className: "bg-slate-50" },

                            className: "px-2 py-1 text-[12px] border border-slate-200 rounded bg-white outline-none focus:border-emerald-500"
                          }, moOpts.map(mo => h("option", { key: mo, value: mo }, MONTH_LABELS[MONTHS.indexOf(mo)], ' (', mo, ')'))),
                          h("span", { className: "text-[11px] text-slate-500" },
                            "→ bản hiện tại kết thúc ", fmtMo(MONTHS[Math.max(0, MONTHS.indexOf(move.tuThang) - 1)]),
                            ", các tháng đó giữ PS ", d.ps),

                          }, "Xác nhận chuyển"),
                          h("button", {
                            onClick: () => setMove(null),

            })))),
      list.length > shownRows && h("div", {
        className: "px-3 py-2 text-[12px] text-slate-500 bg-slate-50 border-t border-slate-100"
      }, "Đang hiện ", fmtInt(shownRows), "/", fmtInt(list.length), " dòng (", shownGroups.length, "/",
        fmtInt(groups.length), " khách hàng) — dùng bộ lọc hoặc ô tìm kiếm để thu hẹp.")));

// ============ MAIN APP ============
function App() {
  const [authed, setAuthed] = useState(false);
  const [auth, setAuth] = useState({
    role: '',
    scope: '',
    username: '',
    bu: '',
    ho_ten: ''
  });
  // Team đang xem trên UI. Chỉ admin/manager mới đổi được; user thường luôn = bu của họ.
  const [viewBu, setViewBu] = useState('');
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [rows, setRows] = useState([]);
  // Dòng thực hiện NGOÀI KẾ HOẠCH — chỉ dùng cho 2 màn tổng hợp, không vào màn chi tiết.
  const [oopRows, setOopRows] = useState([]);
  const [drafts, setDrafts] = useState({}); // { 'row:key': value } — chưa lưu
  const [saving, setSaving] = useState(false);
  const [savedFlash, setSavedFlash] = useState(false);
  const [tab, setTab] = useState('detail'); // 'detail' | 'summary' | 'prodsum' | 'diaban'
  const [notice, setNotice] = useState(''); // thông báo kết quả thao tác (tự tắt sau 8s)
  const [search, setSearch] = useState('');
  // Bộ lọc đa lựa chọn: mảng rỗng = tất cả (không lọc).
  const [psFilter, setPsFilter] = useState([]);
  const [regionFilter, setRegionFilter] = useState([]);
  const [groupFilter, setGroupFilter] = useState([]);
  const [custFilter, setCustFilter] = useState([]);
  const [fields, setFields] = useState([]);
  const [catalog, setCatalog] = useState([]);
  const [customers, setCustomers] = useState([]); // danh mục KH đầy đủ từ dm_khach_hang
  const [psDir, setPsDir] = useState([]); // danh mục PS từ shared.dm_ps
  const [diaBan, setDiaBan] = useState([]); // cấu hình địa bàn (dm_dia_ban)
  const [diaBanBusy, setDiaBanBusy] = useState(false);
  const [dataRev, setDataRev] = useState(0);
  const [stale, setStale] = useState(false);
  const [maskMoney, setMaskMoney] = useState(true);
  const [showBasePlan, setShowBasePlan] = useState(true);
  // Hàm xuất Excel do màn tổng hợp đang mở đăng ký lên (nút nằm trên thanh bộ lọc).
  // setState với hàm phải bọc thêm 1 lớp, không React sẽ tưởng là updater.
  const [exportFn, setExportFn] = useState(null);
  const [addCustOpen, setAddCustOpen] = useState(false); // popup Thêm khách hàng
  const setExporter = useCallback(fn => setExportFn(() => fn), []);
  MASK_MONEY = maskMoney;
  // Sửa số liệu: admin, ps, manager, area_manager (server chốt lại phạm vi ghi của
  // từng role). Xoá dòng / cấu hình địa bàn vẫn chỉ admin -> dùng isAdmin.
  const canEdit = ['admin', 'ps', 'manager', 'area_manager'].includes(auth.role);
  const isAdmin = auth.role === 'admin';
  useEffect(() => {
    // Bypass đăng nhập khi vào từ portal: nếu có token dùng chung (vmed_token) mà tab
    // chưa có phiên riêng -> nạp token chung vào sessionStorage để api() dùng.
    const shared = localStorage.getItem('vmed_token');
    if (shared && !sessionStorage.getItem(TOK_KEY)) sessionStorage.setItem(TOK_KEY, shared);
    if (sessionStorage.getItem(TOK_KEY)) {
      api('ping').then(r => {
        setAuth({
          role: r.role,
          scope: r.scope,
          username: r.username,
          bu: r.bu,
          ho_ten: r.ho_ten || r.hoTen || ''
        });
        // admin/manager mặc định xem TẤT CẢ team (viewBu=''); role khác giữ bu của họ.
        // (Trước đây set = r.bu khiến manager bị lọc theo bu cá nhân -> 0 dòng.)
        setViewBu(canSwitchTeam(r.role) ? '' : (r.bu || ''));
        setAuthed(true);
      }).catch(() => {
        sessionStorage.removeItem(TOK_KEY);
        setLoading(false);
      });
    } else setLoading(false);
  }, []);
  const loadData = useCallback(async () => {
    setLoading(true);
    setError('');
    try {
      // admin/manager: gửi kèm team đang chọn xem (rỗng = tất cả team)
      const r = await api('getData', canSwitchTeam(auth.role) ? { bu: viewBu } : {});
      const fields = r.fields || [];
      setFields(fields);
      const arr = r.rows || [];
      const rowNums = r.rowNums || [];
      const objs = new Array(arr.length);
      for (let i = 0; i < arr.length; i++) {
        const row = arr[i];
        const o = {
          _row: rowNums[i]
        };
        for (let j = 0; j < fields.length; j++) {
          const v = row[j];
          if (v !== '' && v !== null && v !== undefined) o[fields[j]] = v;
        }
        // Chuẩn hoá tên KH để hiển thị (BV + viết hoa chữ cái đầu). custId giữ nguyên làm khoá.
        // Giữ custRaw = tên gốc trong DB để khi THÊM SẢN PHẨM ghi đúng chuỗi cũ
        // (nếu ghi tên đã format thì cùng 1 KH lại có 2 cách viết trong sale_target).
        if (o.cust) {
          o.custRaw = o.cust;
          o.cust = fmtCust(o.cust);
        }
        objs[i] = o;
      }
      setRows(objs);
      // Dòng THỰC HIỆN NGOÀI KẾ HOẠCH: giữ RIÊNG, không trộn vào rows.
      // Chỉ 2 màn tổng hợp dùng tới (cho đủ số); màn chi tiết không thấy, không sửa được.
      // Không đặt _row → mọi thao tác sửa/xoá theo id đều không đụng tới các dòng này.
      const oopArr = r.oopRows || [];
      const oopObjs = new Array(oopArr.length);
      for (let i = 0; i < oopArr.length; i++) {
        const row = oopArr[i];
        const o = { _oop: true };
        for (let j = 0; j < fields.length; j++) {
          const v = row[j];
          if (v !== '' && v !== null && v !== undefined) o[fields[j]] = v;
        }
        // Chuẩn hoá tên KH như dòng kế hoạch để cùng 1 KH hiện cùng một cách viết.
        // Nhãn chung "Ngoài kế hoạch" (khi actual không có tên KH) giữ nguyên.
        if (o.cust && o.cust !== OOP_CUST) o.cust = fmtCust(o.cust);
        oopObjs[i] = o;
      }
      setOopRows(oopObjs);
      if (typeof r.rev === 'number') setDataRev(r.rev);
      setStale(false);
      if (r.role) setAuth({
        role: r.role,
        scope: r.scope,
        username: r.username,
        bu: r.bu,
        ho_ten: r.ho_ten || r.hoTen || ''
      });
    } catch (err) {
      setError('Không tải được dữ liệu: ' + err.message);
    }
    setLoading(false);
  }, [auth.role, viewBu]);
  useEffect(() => {
    if (authed) loadData();
  }, [authed, loadData]);

  // tải danh mục (Catalog) + danh mục khách hàng (dm_khach_hang) để thêm sản phẩm
  useEffect(() => {
    if (!authed) return;
    api('getCatalog').then(r => setCatalog(r.catalog || [])).catch(() => {});
    api('getCustomers').then(r => setCustomers(r.customers || [])).catch(() => {});
  }, [authed]);

  // Danh mục PS (shared.dm_ps) — nguồn chuẩn của PS/miền/team. Phải tải lại khi đổi
  // team đang xem (admin/manager) vì backend lọc theo team. Lỗi KHÔNG chặn app:
  // edge chưa deploy bản mới thì rơi về cách cũ (suy PS từ dữ liệu kế hoạch).
  useEffect(() => {
    if (!authed) return;
    let huy = false;
    api('getPs', canSwitchTeam(auth.role) ? { bu: viewBu } : {})
      .then(r => { if (!huy) setPsDir(r.ps || []); })
      .catch(() => { if (!huy) setPsDir([]); });
    return () => { huy = true; };
  }, [authed, auth.role, viewBu]);

  // Cấu hình địa bàn (dm_dia_ban): dùng ở màn "Cấu hình địa bàn" và ở panel thêm KH
  // (tự điền PS/Miền). Lọc theo team đang xem như getData. Lỗi ở đây KHÔNG được
  // chặn app: edge function chưa deploy bản mới thì chỉ là danh sách rỗng.
  const loadDiaBan = useCallback(async () => {
    try {
      const r = await api('getDiaBan', canSwitchTeam(auth.role) ? { bu: viewBu } : {});
      setDiaBan(r.diaBan || []);
    } catch (e) {
      setDiaBan([]);
    }
  }, [auth.role, viewBu]);
  useEffect(() => {
    if (authed) loadDiaBan();
  }, [authed, loadDiaBan]);
  useEffect(() => {
    if (!notice) return;
    const id = setTimeout(() => setNotice(''), 8000);
    return () => clearTimeout(id);
  }, [notice]);

  // Ghi khai báo địa bàn (thêm/sửa). Chỉ admin — backend cũng chặn lại lần nữa.
  const saveDiaBan = useCallback(async rows => {
    setDiaBanBusy(true);
    setError('');
    try {
      const r = await api('saveDiaBan', { rows });
      await loadDiaBan();
      const s = r.stats || {};
      setNotice(`Đã lưu cấu hình địa bàn: thêm ${s.inserted || 0}, sửa ${s.updated || 0}. ` +
        `Kế hoạch chưa đổi — bấm "Áp dụng" ở dòng lệch để ghi xuống kế hoạch.`);
      return true;
    } catch (err) {
      setError('Lưu cấu hình địa bàn thất bại: ' + diaBanErrMsg(err.message));
      return false;
    } finally {
      setDiaBanBusy(false);
    }
  }, [loadDiaBan]);

  // Chuyển địa bàn sang PS khác từ 1 tháng: đóng bản cũ + mở bản mới (backend làm
  // trong 1 giao dịch). KHÔNG đụng dòng kế hoạch — bản mới sẽ hiện "lệch" để áp dụng.
  const moveDiaBan = useCallback(async ({ id, ps, tuThang }) => {
    setDiaBanBusy(true);
    setError('');
    try {
      const r = await api('chuyenDiaBan', { id, ps, tuThang });
      await loadDiaBan();
      const s = r.stats || {};
      setNotice(`Đã chuyển địa bàn sang PS ${ps} từ tháng ${tuThang}` +
        (s.den_thang_cu ? ` (bản cũ kết thúc ${s.den_thang_cu})` : '') +
        `. Bấm "Áp dụng" ở bản mới để ghi xuống kế hoạch từ tháng ${tuThang} trở đi.`);
      return true;
    } catch (err) {

  const custIndex = useMemo(() => {

  const allPsList = useMemo(() => {

  const priceOf = useMemo(() => {

  const tree = useMemo(() => {
